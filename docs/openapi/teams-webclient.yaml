    ConversationId:
      name: conversationId
      in: path
      required: true
      description: |
        Thread id. For a reply inside a channel thread the bridge sends
        `<threadId>;messageid=<rootMessageId>`, escaped as one segment, so the `;` goes out as `%3B`.
        The code comment on `SendMessage` claims `:` and `@` get encoded too; Go's `url.PathEscape`
        leaves both literal.
