  headers:
    ThreadLocation:
      description: URL of the new thread, e.g. `https://<region>.ng.msg.teams.microsoft.com/v1/threads/19:abc123@thread.v2`.
      schema:
        type: string
  responses:
    SkypeUnauthorized:
      description: |
        Skype token rejected. The bridge mints a new one via authz (refreshing the bearer first when
        needed) and retries the request once.
    BearerUnauthorized:
      description: Bearer rejected. The bridge runs the refresh-token grant and retries the request once.
    Forbidden:
      description: Mapped to `ErrForbidden`, no retry.
    NotFound:
      description: Mapped to `ErrNotFound`, no retry.
    RateLimited:
      description: Mapped to `ErrRateLimited`, no retry and no backoff in the client.
    OtherError:
      description: Any other status >= 400 fails with up to 4 KiB of the body.
