    servers:
      - url: '{negotiation}'
        description: |
          The renegotiation's answer link (`mediaNegotiation.links.mediaAnswer`), for example
          `https://api.flightproxy.teams.microsoft.com/api/v2/ep/cc-<cluster>-prod-aks.cc.skype.com/cc/v1/negotiations/<call id>/<n>/t/<n>/answer`;
          the bridge posts to the link verbatim, split here into base and `/answer` only to fit OpenAPI.
        variables:
          negotiation:
            default: https://api.flightproxy.teams.microsoft.com/api/v2/ep/cc-example-01-prod-aks.cc.skype.com/cc/v1/negotiations/00000000-0000-4000-8000-0000000000d1/595/t/2288
    post:
      tags: [meetings]
      operationId: answerMediaRenegotiation
      summary: Answer a media renegotiation offer
      description: |
        When the lobby admits a joiner (and at other times the controller decides), a
        `call/mediaRenegotiation/` callback delivers `MediaNegotiationOffer`: a new SDP offer with
        renumbered mids (audio 1, camera 2, screen share 3, data 4, other video 5-13) and a
        `mediaLegId`. The call carries no media until it is answered. The answer echoes `mediaLegId`,
        names the sender, links a `call/mediaAcknowledgement/` callback and carries the SDP answer.

        The bridge answers with SDES (Opus at the offered payload type on the audio line, the offered
        crypto tag, every other m-line declined with port 0) as `application/sdp` and
        `callModalities ["Audio"]`, then moves its media to the new leg. With a video leg it also
        accepts the `main-video` lines with H.264 (`packetization-mode=1`, `profile-level-id=42e01f`),
        bundled on one transport, and declares `["Audio","ScreenViewer"]`; whether the media
        processor accepts SDES video from a client is not shown by any capture. The
        `call/mediaAcknowledgement/` callback that follows carries the new call leg's `links`
        (`updateMediaDescriptions`, `applyChannelParameters`, ...), per the bridge's code. The web client answered with
        `application/sdp-ngc-1.0`, `clientLocation`, `mediaDescriptions` (the new mids, `requestId`
        bumped), `applyChannelParameters`, `clientContentForMediaController`, `callModalities`
        `["Audio","ScreenViewer"]` and `debugContent {callId: <chain id>, endpointId}`; it answered two
        renegotiations in the capture, one through the consumer and one through the enterprise
        proxy. 202 in both cases. The offer itself was only recorded by the bridge (see
        `TeamsSdp`).
      security:
        - aadIc3: []
          skypetokenHeader: []
        - skypetokenHeader: []
      parameters:
        - $ref: '#/components/parameters/CallChainId'
        - $ref: '#/components/parameters/CallMessageId'
        - $ref: '#/components/parameters/CallMigration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaAnswerRequest'
            examples:
              bridge:
                value:
                  mediaAnswer:
                    callModalities: [Audio]
                    sender:
                      id: '8:orgid:00000000-0000-0000-0000-000000000001'
                      displayName: Alex Example
                      endpointId: 00000000-0000-4000-8000-000000000001
                      participantId: 00000000-0000-4000-8000-000000000002
                      languageId: en-US
                    links:
                      mediaAcknowledgement: https://pub-ent-euwe-01-f.trouter.teams.microsoft.com:3443/v4/f/AAAAAAAAAAAAAAAAAAAAAA/callAgent/00000000-0000-4000-8000-000000000001/5e6f7a8b/call/mediaAcknowledgement/
                    mediaContent:
                      contentType: application/sdp
                      blob: "v=0\r\n..."
                      mediaLegId: 0123456789ABCDEF0123456789ABCDEF
      responses:
        '202':
          description: Accepted; a `call/mediaAcknowledgement/` callback follows.
        default:
          description: The bridge reports any status >= 300 as a failed renegotiation.
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/calls.go:Call.AnswerRenegotiation"
        - "pkg/msteams/calls.go:mediaNegotiation"
        - "pkg/msteams/calls.go:callPayload"
        - "pkg/msteams/calls.go:Call.watch"
        - "pkg/teamsmedia/sdp.go:answerSDP"
        - "pkg/teamsmedia/sdp.go:writeVideoLine"
