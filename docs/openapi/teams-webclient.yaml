    MediaContent:
      type: object
      properties:
        contentType:
          type: string
          example: application/sdp
        blob:
          type: string
          description: |
            SDP text, or base64 of raw DEFLATE with a preset dictionary when it does not start with
            `v=`; ost says Teams compresses SDPs of 1201 bytes or more.

            The bridge's offer (`audioSDP`) is audio only and uncompressed: one `m=audio` line with
            `RTP/SAVP 0` (PCMU/8000, ptime 20), `b=CT:99980`, the RTP SSRC declared in
            `a=x-ssrc-range` (the code comment: Teams drops RTP from undeclared SSRCs), `rtcp-mux`,
            `a=label` / `a=x-source` `main-audio`, ICE ufrag, password and UDP candidates on the
            m-line, and an SDES key `a=crypto:2 AES_CM_128_HMAC_SHA1_80 inline:<30-byte key>|2^31`.
            No DTLS fingerprint, no BUNDLE.

            From the answer (`parseRemoteAudio`) the bridge takes the ICE ufrag and password of the
            audio section (session level as fallback), the first `a=crypto` or `a=cryptoscale` line
            with that suite, including an optional MKI (`|<value>:<length>`), and the component-1 UDP
            candidates of the audio section. It inflates base64 raw DEFLATE without a dictionary;
            an answer compressed with Teams' preset dictionary fails, since the bridge does not ship
            that dictionary.
      x-evidence:
        - "pkg/teamsmedia/sdp.go:audioSDP"
        - "pkg/teamsmedia/sdp.go:parseRemoteAudio"
        - "pkg/teamsmedia/sdp.go:parseCrypto"
        - "pkg/teamsmedia/sdp.go:parseCandidate"
        - "pkg/teamsmedia/sdp.go:decodeSDPBlob"
        - "ost@0892144 src/calling/signaling.rs:914-1087"
        - "ost@0892144 src/calling/sdp_compress.rs:1-60"
