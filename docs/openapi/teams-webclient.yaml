      summary: Long-poll the conversation broker
      description: |
        The web clients keep one long-poll open per call (`x-usebatching: 1`, `x-skypetoken`, the
        call headers, `content-type: application/json, application/json`). An empty poll answers 202
        with `{"message": "", "nextSubscribeUrl": <same URL>, "expirationTimeInSec": 30}`.
        A poll with data answers 200 and `message` is a comma-separated list of base64(gzip) blobs,
        each a complete HTTP request as Trouter would have delivered it, for example
        `POST /v4/f/<trouter id>/callAgent/<id>/<hex>/call/controlVideoStreaming/ HTTP/1.1` with headers
        and a `ControlVideoStreaming` body; `nextSubscribeUrl` then carries the next sequence number.
