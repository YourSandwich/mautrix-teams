    RosterUpdate:
      type: object
      description: |
        Body of `conversation/rosterUpdate/` callbacks (gzip on Trouter) and the `roster` of a
        conversation document. `type` is `Delta`; each delta carries every changed participant in
        full, and `sequenceNumber` rises. The bridge merges deltas by MRI, keeps a participant's
        highest `version`, and counts someone as in the call when `state` is `active` and an endpoint
        has `call` (a `lobby` endpoint waits in the lobby).

        | Event | Seen as |
        |---|---|
        | join | participant `state: active` with an endpoint under `call` |
        | leave | same participant `state: inactive`, `endpoints: {}` |
        | lobby | endpoint with `lobby` instead of `call`, `modalityJoined: Lobby`, audio `serverMuted: true`, `participantCounts.lobbyParticipants` 1 |
        | admitted | endpoint gets `call`, `modalityJoined: "Lobby,Call"`, new stream `sourceId`s |
        | self-mute | endpoint `endpointState {endpointStateSequenceNumber, state {isMuted}}` |
        | server mute | stream `serverMuted`, `call.serverMuteVersion` |
        | camera on / off | video stream `direction` `sendrecv` / `recvonly`, new `mdRequestId`, `call.negotiationTag` `;v_2` / `;v_1` |
        | screen share on / off | `applicationsharing-video` stream `sendonly` with `ordinal: 1`, tag `;ss_1`; back to `recvonly` |
      properties:
        participants:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RosterParticipant'
        type:
          type: string
          enum: [Delta]
        sequenceNumber:
          type: integer
        participantCounts:
          $ref: '#/components/schemas/ParticipantCounts'
      example:
