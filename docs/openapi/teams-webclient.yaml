          in: query
          required: true
          schema:
            type: string
            enum: ['false']
        - name: enableGuest
          in: query
          required: true
          schema:
            type: string
            enum: ['true']
        - name: includeIBBarredUsers
          in: query
          required: true
          schema:
            type: string
            enum: ['true']
        - name: skypeTeamsInfo
          in: query
          required: true
          schema:
            type: string
            enum: ['true']
        - name: includeBots
