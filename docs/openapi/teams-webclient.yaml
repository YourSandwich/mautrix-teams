openapi: 3.0.3
info:
  title: Microsoft Teams web-client API
  version: '2026-09-26'
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |
    Reverse-engineered reference of the undocumented HTTP and push APIs behind the Microsoft Teams
    web client, for work and school accounts (`teams.microsoft.com`, `teams.cloud.microsoft`) and
    for personal Microsoft accounts (`teams.live.com`): sign-in, chat, media, profiles, presence and
    status, Trouter push, calls, meetings, calendar, files and recordings. It collects everything
    the sources below show, with example data, so that a client can be built from it; the
    mautrix-teams bridge (`pkg/msteams`, `pkg/teamsmedia`) is one such client.

    **This is not a Microsoft contract.** Every path, header and field here was read out of source
    code (this repository's or another client's), out of HAR captures of the Teams web client, or out of
    requests the bridge made. Microsoft can change or remove any of it without notice, and shapes
    differ between tenants, regions and client versions. Anything a source did not show is left out
    or marked as unknown ("not captured", "not shown in any source"). Microsoft Graph is described
    separately in `graph-teams-v1.0.yaml`.

    **All example values are synthetic.** Ids use the `00000000-0000-0000-0000-00000000000n`
    pattern, people are `Alex Example` and `Sam Sample` (`@contoso.example`), IP addresses come
    from 192.0.2.0/24 and 203.0.113.0/24, and tokens and keys are placeholders.

    ## Conventions

    - `x-bridge-usage` on every operation: `used` means `pkg/msteams` sends this request;
      `documented-only` means another client's source or a capture shows it and the bridge does not
      send it. Parameters, properties, servers and frames carry the same marker where they differ
      from their operation.
    - `x-evidence` lists where a claim comes from:
      - `pkg/...:Func` is this repository (function names, not line numbers).
      - `<project>@<commit> <file>:<lines>` is another client's source.
      - `captured: <client>/<session>` is a HAR capture of the Teams web client, see "Captures".
      - `observed: ...` is something the bridge or a manual request saw on the wire that no capture
        or source file holds (for example one authz `regionGtms` response, the device-code client matrix, the
        call-control error codes the bridge logged).
    - Fields that hold JSON inside a JSON string are `type: string` with `x-embedded-json-schema`
      pointing at the decoded shape.
    - OpenAPI 3.0 cannot model websockets. The Trouter frames are listed in the `x-websocket-frames`
      extension of `trouterWebSocket`; the callback bodies call control posts to Trouter are schemas
      referenced from there.
    - URLs a server hands out at runtime and that clients must treat as opaque (conversation
      controllers, call legs, negotiation and broker links) are modelled as a server whose whole URL
      is one variable, with the documented suffix as the path.

    ## Evidence sources

    | Project | Commit | What it contributes |
    |---|---|---|
    | this repository, `pkg/msteams`, `pkg/teamsmedia` | working tree | everything marked `used` |
    | EionRobb/purple-teams | `f7eb519` | chat service, Trouter, presence reads and writes, personal accounts |
    | eisbaw/ost | `0892144` | outgoing call signalling, incoming-call accept (untested), recording |
    | IanTerzo/Squads | `f977552` | presence pubsub via UPS, Trouter envelope, AMS GETs, Graph shares |
    | fossteams/teams-api | `60cd5c1` | authz struct, JSON fixtures of CSA, messages, tenants |

    ## Captures

    HAR exports of the Teams web client made on 2026-09-26. The exports strip `Authorization` and
    `Cookie`, so the bearer audience of a captured request is unknown unless noted; `x-skypetoken`,
    `authentication: skypetoken=` and `x-authorization` survived.

    | Label | Client | What it shows |
    |---|---|---|
    | `enterprise/calls` | `teams.cloud.microsoft` | Echo test call, 1:1 call answered by voicemail, Meet Now with a lobby visitor |
    | `enterprise/called` | `teams.cloud.microsoft` | joining a personal account's meeting by link, camera, screen share, mute (main Trouter socket not recorded) |
    | `enterprise/calendar` | `teams.cloud.microsoft` | calendar, meeting details, a recording and its transcript, a cancelled meeting deleted |
    | `enterprise/fileupload` | `teams.cloud.microsoft` | sending small and large files in a 1:1 chat |
    | `consumer/login` | `teams.live.com` | personal-account sign-in with an e-mail code, chat bootstrap, two messages sent |
    | `consumer/calling` | `teams.live.com` | hosting a Meet Now, admitting a work user from the lobby, camera, screen share, mute |
    | `consumer/meeting` | `teams.live.com` | a second Meet Now, with the chat and presence pushes on the Skype Trouter socket |
    | `enterprise/incoming1to1` | `teams.cloud.microsoft` | a colleague's incoming 1:1 call rung, attached to and answered (2026-09-27; one capture has the Trouter push, another the requests) |

    ## Accounts, clients and tenants

    Work or school accounts and personal Microsoft accounts (MSA) sign in through different OAuth
    clients, and the client is bound to the device code before anyone signs in, so a client has to
    know the account type up front.

    | Client id | Registration | Used by |
    |---|---|---|
    | `1fec8e78-bce4-4aaf-ab1b-5451cc387264` | Teams (work) | the bridge's work login, Squads, ost; FOCI refresh for every work audience |
    | `8ec6bc83-69c8-4392-8f08-b3c986009232` | Teams (personal) | the bridge's personal login, purple-teams' personal build |
    | `4b3e8f46-56d3-427f-b1e2-d239b2ea6bca` | Teams web SPA on `teams.live.com` | the consumer web client (auth code + PKCE) |
    | `5e3ce6c0-2b1f-4285-8d4b-75ee78787346` | Teams web client ("Microsoft Teams Web Client") | the enterprise web client, teams-token |

    Device-code requests against the v2.0 endpoint (observed 2026-09-26, no sign-in completed):

    | Client | tenant `consumers` | tenant `common` |
    |---|---|---|
    | `1fec8e78` | refused: `AADSTS70002` not enabled for consumers | code issued |
    | `8ec6bc83` | code issued | code issued |
    | `4b3e8f46` | refused: must be a mobile client | refused |

    The Microsoft-account tenant id is `9188040d-6c67-4c5b-b112-36a304b66dad`; an id_token `tid` with
    that value marks a personal account.

    ## Tokens

    Every AAD token after sign-in comes from the refresh-token grant
    (`POST https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token`), one scope per request,
    with the client id of the login.

    Work login (`1fec8e78`, tenant = the login's `tid`, else `common`); scope strings exactly as in
    `auth.go`:

    | Token | Scope | Used by |
    |---|---|---|
    | skype-spaces bearer | `https://api.spaces.skype.com/.default openid profile offline_access` | authz, middle tier, registrar, Trouter `user.authenticate`, avatar cookie |
    | CSA | `https://chatsvcagg.teams.microsoft.com/.default offline_access` | CSA |
    | search | `https://outlook.office.com/search/.default offline_access` | substrate people search |
    | Loki | `394866fc-eedb-4f01-8536-3ff84b16be2a/.default offline_access` | person card |
    | SharePoint | `https://<sharepoint host>/.default offline_access` | `download.aspx`, chat-file upload and invite |
    | Graph | `https://graph.microsoft.com/.default offline_access` | `GET /me?$select=mySite`, shares fallback, preferred presence reset, automatic replies (see the Graph spec) |
    | IC3 | `https://ic3.teams.office.com/.default offline_access` | call control |
    | presence | `https://presence.teams.microsoft.com/.default offline_access` | presence subscriptions, status and status note |

    Personal login (`8ec6bc83`, tenant `consumers` for device code and refresh):

    | Token | Scope | Used by |
    |---|---|---|
    | middle tier | `https://mtsvc.fl.teams.microsoft.com/teams.mt.readwrite openid profile offline_access` | the device-code login itself |
    | authz bearer | `service::api.fl.spaces.skype.com::MBI_SSL openid profile offline_access` | `authorizeConsumer` (v1.0) |

    Everything else a personal login does uses the skype token. The bridge mints no CSA, search,
    Loki, SharePoint, Graph, IC3 or presence token for it.

    The consumer web client (`4b3e8f46`) redeems an auth code at `consumers` and then refreshes
    against the raw MSA tenant id (`/9188040d-.../oauth2/v2.0/token?nopa=2&coa=1`, all answered 200),
    one scope each: `https://auth.fl.teams.microsoft.com/teams.auth.readwrite`,
    `https://mtsvc.fl.teams.microsoft.com/teams.mt.readwrite`,
    `https://groupssvc.fl.teams.microsoft.com/teams.readwrite`, `https://augloop.office.com/v2/.default`
    and `liveprofilecard.access`, always with `openid profile offline_access`. Its tokens live
    28799 s (`LiveProfileCard.Access` 86399 s) and report `refresh_token_expires_in` of about 86400 s.
    The `*.fl.teams.microsoft.com` access tokens are JWE and cannot be decoded.

    The enterprise web client (`5e3ce6c0`) requests `https://ic3.teams.office.com//.default` (double
    slash, with a `claims` parameter), SharePoint, Loki and records-service audiences the same way.
    A second client id, `ceb96695-e468-48ba-ba21-35e2a242d396`, requested the
    `https://outlook.office.com/.default` token; which component asked is not visible.

    The skype token comes from authz and goes out in several shapes depending on the service
    (`components.securitySchemes`). It is a JWT (work: about one day; consumer: 28799 s) whose
    `skypeid` claim is `orgid:<oid>` or `live:.cid.<cid>`.

    ## Host discovery

    Clients start from fixed defaults and replace them with URLs from the authz `regionGtms` map
    (`applyAuthzEndpoints`). Keys seen in the work and consumer responses:

    | `regionGtms` key | Service | Work example | Consumer example |
    |---|---|---|---|
    | `chatService` | chat service | `https://<geo>.ng.msg.teams.microsoft.com` | `https://msgapi.teams.live.com` (the web client never calls it) |
    | `chatServiceAfd` | chat service front door | `https://teams.microsoft.com/api/chatsvc/<geo>` | `https://teams.live.com/api/chatsvc/consumer` (the bridge's choice for personal logins) |
    | `middleTier` | middle tier | `https://teams.microsoft.com/api/mt/part/<partition>` | `https://teams.live.com/api/mt` |
    | `chatSvcAggAfd` | CSA | `https://teams.microsoft.com/api/csa/<geo>` | absent; the web client uses `https://teams.live.com/api/csa` |
    | `ams`, `amsV2` | AMS | `https://<geo>-prod.asyncgw.teams.microsoft.com` | `https://us-api.asm.skype.com`, `https://experimental-api.asm.skype.com` |
    | `unifiedPresence` | presence | `https://presence.teams.microsoft.com` | `https://presence.teams.live.com` (never called) |
    | `presenceUPS` | presence behind the front door | `https://teams.microsoft.com/ups/<geo>` | `https://teams.live.com/ups/global` (called) |
    | `calling_conversationServiceUrl` | call creation | `https://api-<geo>.flightproxy.teams.microsoft.com/api/v2/epconv` | absent; the web client posts to `https://api.flightproxy.skype.com/api/v2/cpconv` |
    | `calling_callControllerServiceUrl` | call controller | `https://<geo>.cc.skype.com` | `https://api.cc.skype.com` |
    | `calling_callStoreUrl` | call store (`getCallStoreConversations`) | `https://api-<geo>.flightproxy.teams.microsoft.com/api/v2/ep/api.userstore.skype.com/` | absent |
    | `calling_registrarUrl` | registrar | `https://teams.microsoft.com/registrar/prod/V2/registrations` | absent |
    | `calling_potentialCallRequestUrl` | ost's fallback for the epconv URL | `https://api-<geo>.flightproxy.teams.microsoft.com/api/v2/ep/<geo>.cc.skype.com/cc/v1/potentialcall` | absent |
    | `calling_udpTransportUrl` | media relay (not used by any source) | `udp://api-<geo>.flightproxy.teams.microsoft.com:3478` | absent |
    | `mcpService` | meeting content (recordings, transcripts) | `https://teams.microsoft.com/api/mcps/<geo>` | absent |
    | `searchService`, `search` | message search | `search`: `https://<geo>-prod.asyncgw.teams.microsoft.com/msgsearch` | `https://teams.live.com/api/search`, `https://msgsearch.skype.com` |

    The consumer response also nests objects in `regionGtms` (`*EndpointMetadata`,
    `{endpointUrl, authority, tokenScopes[]}`), so a decoder must not expect only strings
    (`RegionGtms`). The bridge's fallbacks when a key is absent:

    | Key | Fallback |
    |---|---|
    | `chatService` | `https://apac.ng.msg.teams.microsoft.com` |
    | `middleTier` | `https://teams.microsoft.com/api/mt/part/emea-03` |
    | `chatSvcAggAfd` | `https://teams.microsoft.com/api/csa` |
    | `ams`, then `mediaStream` | `https://teams.microsoft.com/api/amsMTProd` |
    | `unifiedPresence` | `https://presence.teams.microsoft.com` |
    | `calling_conversationServiceUrl` | none; calls fail without it |

    The work authz `region` and `partition` fields go out as the `ms-teams-region` and
    `ms-teams-partition` headers of call-control requests. The Loki/Delve host prefix (`nam`, `eur`
    or `apc`) is derived from `userPartition`, `partition`, `userRegion` and `region` in that order
    (`lokiPrefixFor`), defaulting to `nam`. A chat-service base stored with the login is never
    overwritten.

    The web clients call the same services through their own origins: `teams.cloud.microsoft`
    (enterprise: `/api/chatsvc/<geo>`, `/api/mt/part/<partition>`, `/api/csa/<geo>`,
    `/ups/<geo>`, `/registrar/prod/V2`, `/api/mcps/<geo>`) and `teams.live.com` (consumer).

    ## Personal accounts in short

    - Chat service at `https://teams.live.com/api/chatsvc/consumer` with the headers
      `ms-ic3-product: tfl`, `ms-ic3-additional-product: Sfl` and `behavioroverride: redirectAs404`
      next to `authentication: skypetoken=`.
    - Middle tier at `https://teams.live.com/api/mt` (`beta/...`, `v1/...`, `v2.0/...`) with
      `x-skypetoken`; profiles through `tenantsv2`, `users/me/`, `fetchShortProfile` (for `8:live:`)
      and `fetchFederated` (for `8:orgid:`), pictures through an image cookie.
    - CSA v3 at `https://teams.live.com/api/csa/api/v3/teams/users/me` with `x-skypetoken`.
    - Presence at `https://teams.live.com/ups/global` with `x-skypetoken` and
      `x-ms-client-consumer-type: teams4life`.
    - Two Trouter sockets: chat and presence on `go.trouter.skype.com` (`tc.ua` `TeamsCDL`,
      registrar `edge.skype.com`), calls on `go.trouter.teams.microsoft.com` with `dom=teams.live.com`
      (`tc.ua` `SkypeSpaces`, registrar `teams.microsoft.com/registrar/prod/v2`). Both authenticate
      with `X-Skypetoken`.
    - Calls and meetings through `https://api.flightproxy.skype.com/api/v2/cpconv` and controllers
      under `https://api.flightproxy.skype.com/api/v2/cp/...`, with
      `conversationRequest.applicationType: TFL` and `x-skypetoken`.

    ## Shared behaviour of the bridge's chat-service and middle-tier calls

    These go through `doJSON`: `User-Agent` is the configured one (the connector never sets it, so
    `Mozilla/5.0 mautrix-teams`), `Accept: application/json`, and `Content-Type: application/json`
    when there is a body. Tokens within 60 s of expiry are refreshed first. A 401 triggers one
    refresh (authz for skype-token calls, the refresh grant for bearer calls) and one retry. 403, 404
    and 429 map to `ErrForbidden`, `ErrNotFound` and `ErrRateLimited` without a retry. Any other
    status >= 400 surfaces the first 4 KiB of the body. When the caller expects a response body,
    only a 201 or 204 may come back empty; an empty 200 is an error.

    The web clients add their own diagnostic headers to most requests (`x-ms-client-type` `web` or
    `cdlworker`, `x-ms-client-version` such as `1415/26090318549`, `x-ms-session-id`,
    `x-ms-request-id`, `x-ms-client-caller`, `x-ms-correlation-id`, `clientinfo` on the consumer chat
    service). No source shows that any of them is required.

    ## Identifiers

    - MRIs: `8:orgid:<AAD object id>` for work accounts, `8:live:.cid.<16 hex>` for personal
      accounts (`"8:" + skypeToken.skypeid`; the AAD-style object id of such an account is
      `00000000-0000-0000-<cid split 4+12>`), `8:teamsvisitor:<hex>` for anonymous meeting guests,
      `28:<id>` for bots, `4:<number>` for PSTN, `48:<name>` for virtual system threads such as
      `48:calllogs` and `48:notifications`. `1:` also occurs in sender URLs.
    - Thread ids: `19:<id>@thread.v2` (group chats; meetings as `19:meeting_<base64>@thread.v2`),
      `19:<id>@thread.tacv2` (channels), `19:<oidA>_<oidB>@unq.gbl.spaces` (work 1:1 chats, the two
      object ids sorted lexicographically), `19:uni01_<52 base32 characters>@thread.v2` (a 1:1 chat
      between a personal and a work account, `isOneOnOne: true` in CSA). A bare `8:` MRI is also
      treated as a 1:1 conversation by the bridge.
    - Message ids and client message ids are millisecond Unix epochs as decimal strings (the web
      client's `clientmessageid` is a random 19-digit number); `composetime` and
      `originalarrivaltime` are ISO 8601.
    - Meetings: a join link `https://teams.microsoft.com/l/meetup-join/<thread>/0?context={"Tid","Oid"}`,
      a short link `https://teams.microsoft.com/meet/<code>?p=<passcode>` or
      `https://teams.live.com/meet/<code>?p=<passcode>`, a numeric meeting code (12 to 15 digits
      seen) and an 18-character passcode; the conversation service also hands out a 6-character
      passcode for the same meeting (`MeetingData`).
    - Path segments are escaped with Go's `url.PathEscape` by the bridge: `:` and `@` stay literal,
      `;` becomes `%3B`. The web clients escape `:` and `@` as well (`19%3A...%40thread.v2`).
servers:
  - url: https://{region}.ng.msg.teams.microsoft.com
    description: |
      Regional chat service, taken from `regionGtms.chatService`. Observed value for one tenant:
      `https://at.ng.msg.teams.microsoft.com`. Without authz data the bridge uses `apac`.
    variables:
      region:
        default: apac
        description: Region or country code (`apac` is the bridge default, `at` was observed).
    x-bridge-usage: used
    x-evidence:
      - "pkg/msteams/client.go:DefaultChatSvcBase"
      - "pkg/msteams/auth.go:applyAuthzEndpoints"
      - "observed: regionGtms.chatService"
  - url: https://teams.microsoft.com/api/chatsvc/{geo}
    description: |
      Chat-service proxy on teams.microsoft.com (`regionGtms.chatServiceAfd`, observed
      `https://teams.microsoft.com/api/chatsvc/at`). Squads sends the same `/v1/...` paths here with
      an `https://ic3.teams.office.com/.default` bearer instead of a skype token. The enterprise web
      client uses the same path on its own origin, `https://teams.cloud.microsoft/api/chatsvc/<geo>`
      (captured with `geo` `at`). The bridge does not use it for work logins.
    variables:
      geo:
        default: emea
        description: Squads hard-codes `emea`; the observed `chatServiceAfd` used `at`.
    x-bridge-usage: documented-only
    x-evidence:
      - "Squads@f977552 src/api.rs:1543-1552"
      - "Squads@f977552 src/api.rs:1584-1619"
      - "observed: regionGtms.chatServiceAfd"
      - "captured: enterprise/calls"
  - url: https://teams.live.com/api/chatsvc/consumer
    description: |
      Consumer chat service front door (`regionGtms.chatServiceAfd` of a personal account). The
      bridge's personal logins and the consumer web client use it with `authentication:
      skypetoken=<token>`, `ms-ic3-product: tfl` and `ms-ic3-additional-product: Sfl`; the web client
      adds `behavioroverride: redirectAs404` and `clientinfo`. Links in its responses and pushes
      point at `https://msgapi.teams.live.com` and `https://notifications.skype.net`, which the web
      client never calls. Whether the `ms-ic3-*` headers are mandatory is not known.
    x-bridge-usage: used
    x-evidence:
      - "pkg/msteams/auth.go:applyAuthzEndpoints"
      - "pkg/msteams/http.go:attachAuth"
      - "purple-teams@f7eb519 libteams.h:128-130"
      - "purple-teams@f7eb519 teams_connection.c:120-130"
      - "captured: consumer/login"
tags:
  - name: auth
    description: OAuth device-code, auth-code and refresh-token grants, and the authz exchange for a skype token.
  - name: chat-service
    description: Conversations, messages, reactions, read markers and thread management (`/v1/...`).
  - name: ams
    description: Async media service (AMS) objects, used for images, videos, voice messages and legacy file transfers.
  - name: middle-tier
    description: Middle tier (`/api/mt`) - tenants, profiles, profile pictures, contacts, settings.
  - name: csa
    description: Chat service aggregator (CSA) - the joined teams, their channels and the chat list.
  - name: search
    description: substrate.office.com people search, the Teams people picker.
  - name: people-card
    description: Loki/Delve live persona card - phones, work details, postal addresses.
  - name: sharepoint
    description: Uploading files sent in chats to OneDrive, sharing them, and downloading shared files.
  - name: trouter
    description: Trouter push service bootstrap and the socket.io websocket that carries all push events.
  - name: registrar
    description: Registration of Trouter paths so services know where to push.
  - name: presence
    description: Unified presence service (UPS) - subscriptions delivered over Trouter, polling, and writing the own status.
  - name: calling
    description: Call signalling - conversation creation, ringing, acceptance, media negotiation, hanging up.
  - name: meetings
    description: Joining meetings, the lobby, the roster, in-call state (mute, camera, screen share) and the call controller's links.
  - name: calendar
    description: The Teams calendar through the middle tier, meeting details and Meet Now.
  - name: recordings
    description: Meeting recordings, transcripts and recap content (MCPS and SharePoint).
paths:
  /{tenant}/oauth2/v2.0/devicecode:
    servers:
      - url: https://login.microsoftonline.com
        description: Microsoft identity platform.
    parameters:
      - $ref: '#/components/parameters/Tenant'
    post:
      tags: [auth]
      operationId: startDeviceCode
      summary: Start a device-code login
      description: |
        First step of the bridge's only interactive login. The account type picks the client before
        anyone signs in (see "Accounts, clients and tenants" in `info`):

        | Login | `client_id` | tenant | `scope` |
        |---|---|---|---|
        | work or school | `1fec8e78-bce4-4aaf-ab1b-5451cc387264` | the tenant the user typed, else `organizations` | `https://api.spaces.skype.com/.default openid profile offline_access` |
        | personal | `8ec6bc83-69c8-4392-8f08-b3c986009232` | `consumers` | `https://mtsvc.fl.teams.microsoft.com/teams.mt.readwrite openid profile offline_access` |

        The work client is refused on `consumers` (`AADSTS70002`), and the consumer web client's SPA
        registration `4b3e8f46-...` cannot use device code at all. No `User-Agent` is set explicitly.
        purple-teams' personal build uses the v1 endpoint
        (`common/oauth2/devicecode` with `resource=https://api.spaces.skype.com`) and Squads the v1
        endpoint on `organizations` with the same resource.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
            examples:
              work:
                value:
                  client_id: 1fec8e78-bce4-4aaf-ab1b-5451cc387264
                  scope: https://api.spaces.skype.com/.default openid profile offline_access
              personal:
                value:
                  client_id: 8ec6bc83-69c8-4392-8f08-b3c986009232
                  scope: https://mtsvc.fl.teams.microsoft.com/teams.mt.readwrite openid profile offline_access
      responses:
        '200':
          description: |
            Device code issued. An `interval` <= 0 is treated as 5 s. A 200 without `device_code` or
            `user_code` is treated as a failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeResponse'
        default:
          description: |
            Any status >= 400 aborts the login; up to 8 KiB of the body end up in the error. A refused
            client/tenant pair answers with an OAuth error such as `AADSTS70002`.
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/auth.go:StartDeviceCode"
        - "pkg/msteams/auth.go:oauthClientID"
        - "pkg/connector/login.go:TeamsDeviceCodeLogin.startDeviceCode"
        - "purple-teams@f7eb519 teams_login.c:798-843"
        - "Squads@f977552 src/api.rs:20-66"
        - "observed: device-code requests per client and tenant, 2026-09-26"
  /{tenant}/oauth2/v2.0/token:
    servers:
      - url: https://login.microsoftonline.com
        description: Microsoft identity platform.
    parameters:
      - $ref: '#/components/parameters/Tenant'
    post:
      tags: [auth]
      operationId: requestToken
      summary: Redeem a device code, an auth code or a refresh token
      description: |
        Three grants use this endpoint. The bridge sends no client secret and always the client id
        of the login (`1fec8e78-...` work, `8ec6bc83-...` personal).

        - Device-code polling (`PollDeviceCode`, tenant `organizations` or `consumers`): the first poll
          waits one `interval`; `slow_down` adds 5 s. The status code is not inspected: any response
          carrying `access_token` is success, otherwise the `error` field decides.
        - Refresh-token grant (`refreshOAuthToken`): mints every token the bridge uses, one scope per
          request (token tables in `info`). The tenant is `consumers` for personal logins, else the
          login's `tid` claim or `common`. A rotated `refresh_token` in the response replaces the
          stored one. A status >= 400 or a non-empty `error` is a failure; `invalid_grant` becomes
          `ErrTokenInvalid`, which ends the login.
        - Authorization code with PKCE (documented-only): the consumer web client redeems the code of
          its `teams.live.com` sign-in at `consumers` with `client_id=4b3e8f46-...`,
          `redirect_uri=https://teams.live.com/v2/authv2`, `code_verifier`, `client_info=1` and a form
          field `X-AnchorMailbox=Oid:<object id>@9188040d-6c67-4c5b-b112-36a304b66dad`. It then refreshes
          against the MSA tenant id itself (`/9188040d-6c67-4c5b-b112-36a304b66dad/oauth2/v2.0/token?nopa=2&coa=1`),
          which answered 200 each time. The bridge refreshes personal logins at `consumers` instead.

        Squads adds `Origin: https://teams.microsoft.com`, `client_info=1`,
        `x-client-SKU=msal.js.browser` and `claims={"access_token":{"xms_cc":{"values":["CP1"]}}}` to its
        refresh grants; the enterprise web client sent a `claims` parameter on its IC3 and SharePoint
        refreshes.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RefreshTokenGrantRequest'
                - $ref: '#/components/schemas/DeviceCodeGrantRequest'
                - $ref: '#/components/schemas/AuthCodeGrantRequest'
            examples:
              refreshWork:
                value:
                  client_id: 1fec8e78-bce4-4aaf-ab1b-5451cc387264
                  grant_type: refresh_token
                  refresh_token: <refresh token>
                  scope: https://ic3.teams.office.com/.default offline_access
              refreshPersonal:
                value:
                  client_id: 8ec6bc83-69c8-4392-8f08-b3c986009232
                  grant_type: refresh_token
                  refresh_token: <refresh token>
                  scope: service::api.fl.spaces.skype.com::MBI_SSL openid profile offline_access
              deviceCode:
                value:
                  client_id: 1fec8e78-bce4-4aaf-ab1b-5451cc387264
                  grant_type: urn:ietf:params:oauth:grant-type:device_code
                  device_code: <device code>
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        default:
          description: |
            OAuth error. Device-code polling handles `authorization_pending` (poll again),
            `slow_down` (poll again 5 s later), `expired_token` / `code_expired` (fail),
            `authorization_declined` / `access_denied` (fail as declined). Anything else fails with
            `error` and `error_description`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/auth.go:PollDeviceCode"
        - "pkg/msteams/auth.go:refreshOAuthToken"
        - "pkg/msteams/auth.go:RefreshAuthToken"
        - "Squads@f977552 src/api.rs:294-355"
        - "captured: consumer/login"
        - "captured: enterprise/calls"
  /{tenant}/oauth2/v2.0/authorize:
    servers:
      - url: https://login.microsoftonline.com
        description: Microsoft identity platform.
    parameters:
      - $ref: '#/components/parameters/Tenant'
    get:
      tags: [auth]
      operationId: authorizeInteractive
      summary: Browser sign-in of the consumer web client (auth code with PKCE)
      description: |
        Browser-only; listed so that the consumer web client's token chain is complete. The web
        client first probes silently with `prompt=none` (an implicit `response_type=token` probe with
        `scope=openid profile` and `redirect_uri=https://teams.live.com/v2/auth`, then a PKCE probe
        with `scope=https://mtsvc.fl.teams.microsoft.com/teams.mt.readwrite openid profile offline_access`),
        both answered by a redirect carrying `error=login_required` when there is no session. The
        interactive request uses `prompt=select_account` and hands over to `login.live.com`, where the
        user signs in (the capture shows an e-mail one-time code); the result is a redirect to
        `https://teams.live.com/v2/authv2#code=...&client_info=...&state=...`, redeemed at
        `requestToken`. A server-side client cannot use this flow: `4b3e8f46` is an SPA registration.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            example: 4b3e8f46-56d3-427f-b1e2-d239b2ea6bca
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code, token]
        - name: scope
          in: query
          required: true
          schema:
            type: string
            example: openId profile openid offline_access
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            example: https://teams.live.com/v2/authv2
        - name: prompt
          in: query
          required: false
          schema:
            type: string
            enum: [none, select_account]
        - name: code_challenge
          in: query
          required: false
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: false
          schema:
            type: string
            enum: [S256]
        - name: response_mode
          in: query
          required: false
          schema:
            type: string
            enum: [fragment]
      responses:
        '302':
          description: Redirect to `login.live.com`, or back to `redirect_uri` with a code, a token or an error in the fragment.
        default:
          description: Not captured.
      x-bridge-usage: documented-only
      x-evidence:
        - "captured: consumer/login"
