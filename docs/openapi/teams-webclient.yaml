    Message:
      type: object
      description: |
        Chat-service message resource, as returned by `listMessages` and pushed in Trouter
        `NewMessage` / `MessageUpdate` events.
      properties:
        id:
          type: string
          description: Server message id (ms epoch).
          example: '1700000000000'
        from:
          type: string
          description: |
            Sender contact URL, e.g.
            `https://<region>.ng.msg.teams.microsoft.com/v1/users/ME/contacts/8:orgid:<oid>`, or a bare
            MRI. ThreadActivity messages are authored by the thread
            (`.../contacts/19:...@thread.v2`). The bridge takes the MRI after the last `/8:`, `/1:`,
            `/4:` or `/28:`.
          example: https://emea.ng.msg.teams.microsoft.com/v1/users/ME/contacts/8:orgid:00000000-0000-0000-0000-000000000001
        conversationLink:
          type: string
          description: |
            `.../v1/users/ME/conversations/<threadId>[;messageid=<rootId>]`. The thread id is the
            segment after `/conversations/` up to `;`; a `;messageid=` suffix marks a channel reply and
            names its root. Squads sees the prefix `https://notifications.skype.net/v1/users/ME/conversations/`
            on Trouter pushes.
          example: https://emea.ng.msg.teams.microsoft.com/v1/users/ME/conversations/19:abc123@thread.tacv2;messageid=1700000000000
        messagetype:
          type: string
          description: |
            Known values: `Text`, `RichText`, `RichText/Html`, `RichText/UriObject`,
            `RichText/Media_GenericFile`, `RichText/Media_Card`, `RichText/Media_FlikMsg`,
            `RichText/Media_Call`, `Event/Call`, `Control/Typing`, `Control/ClearTyping`,
            `ThreadActivity/AddMember`, `/DeleteMember`, `/TopicUpdate`, `/MemberJoined`,
            `/MemberLeft`, `/CallStarted`, `/CallEnded`, `/CallRecordingFinished`; seen elsewhere:
            `ThreadActivity/RoleUpdate`, `ThreadActivity/SpaceTopicUpdated`, `Signal/Flamingo`,
            `RichText/Media_CallRecording`, `RichText/Media_CallTranscript`.
          example: RichText/Html
        contenttype:
          type: string
          example: text
        content:
          type: string
          description: |
            HTML or text for messages. For `ThreadActivity/AddMember`, `/DeleteMember` and
            `/TopicUpdate` an XML fragment; for `/MemberJoined` and `/MemberLeft` JSON
            (`ThreadActivityMembers`).
          x-embedded-json-schema:
            $ref: '#/components/schemas/ThreadActivityMembers'
        composetime:
          type: string
          description: ISO 8601.
          example: '2026-01-01T12:00:00.0000000Z'
        originalarrivaltime:
          type: string
          description: ISO 8601.
        clientmessageid:
          type: string
        imdisplayname:
          type: string
          description: Sender display name; cached per sender MRI.
        skypeeditedid:
          type: string
          description: Marks an edit when set; the code comment notes this service leaves it unset in practice.
        deletetime:
          oneOf:
            - type: string
            - type: number
          description: Set on deleted messages.
        properties:
          $ref: '#/components/schemas/MessageProperties'
        type:
          type: string
          example: Message
          x-bridge-usage: documented-only
        conversationid:
          type: string
          x-bridge-usage: documented-only
        sequenceId:
          type: integer
