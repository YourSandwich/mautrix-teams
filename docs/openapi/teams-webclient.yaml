    TeamsSdp:
      type: string
      description: |
        The SDP inside `MediaContent.blob`. Media is `RTP/SAVP` (or `RTP/AVP` in the media
        processor's renegotiation offer) with `rtcp-mux`; ICE credentials sit on each m-line.

        **Group call and meeting layout (13 m-lines, BUNDLE).** The web clients offer, and the media
        processor (MP) answers, the same 13 m-lines in every captured call, meeting and join:

        | mid (first offer) | mid (after renegotiation) | Kind, `a=label` | Role | MP `x-source-streamid` |
        |---|---|---|---|---|
        | 0 | 1 | audio `main-audio` | mixed meeting audio both ways | 201 (first leg), 414 (after admission) |
        | 1 | 2 | video `main-video` | own camera (`x-ssrc-range` of 100 SSRCs) | 202 / 415 |
        | 2-6 | 5-9 | video `main-video` | receive slots, sendrecv in SDP | 203-207 / 416-420 |
        | 7-10 | 10-13 | video `main-video` | receive-only slots (MP `sendonly`) | 208-211 / 421-424 |
        | 11 | 3 | video `applicationsharing-video` | screen share (VBSS), H.264 or AV1 | 212 / 425 |
        | 12 | 4 | `m=x-data`, `data` | SCTP data channel (`a=x-data-protocol`, `a=sctp-port:5000`, `a=max-message-size:262144`) | 213 / 426 |

        The `sourceId`s of the own roster streams equal the MP's `x-source-streamid`s. The web clients
        send `mediaDescriptions` next to the SDP listing mids 1-6 and 11 (`recvonly`, or the camera
        `sendrecv` with `label`) and flip them later with `updateMediaDescriptions` instead of
        renegotiating. Which remote participant lands in which receive slot is not visible in any
        capture; receive-side selection seems to ride the media path (the `x-data` channel or RTCP,
        not captured).

        **Web client offer** (captured): DTLS-SRTP only (`a=fingerprint:sha-256`,
        `a=setup:actpass`, no `a=crypto`), `b=CT:4000`, `a=extmap-allow-mixed`,
        `a=msid-semantic: WMS *`, trickle ICE with a single `tcp-act` placeholder candidate (the 1:1
        call offer had gathered candidates). Audio: `CN/48000`, Opus (`minptime=10;useinbandfec=1`),
        RED, G722, PCMU, PCMA, CN, telephone-event, `a=x-signaling-fb:* x-message app recv:dsh`. Video:
        H.264 with profile-level-ids `64001f`, `42001f`, `42e01f`, `4d001f` (modes 0 and 1),
        `f4001f` on receive-only mids, AV1, one RTX per codec; `rtcp-fb` `goog-remb`, `transport-cc`,
        `ccm fir`, `nack`, `nack pli`; `a=x-signaling-fb:* x-message app send:src recv:src,vc`. No
        VP8, VP9 or X-H264UC in any captured SDP.

        **MP answer to it**: `a=setup:passive`, relay candidates only (UDP with an `MTURNID`
        extension, IPv4 and IPv6, and `tcp-pass`), on the audio line only, shared through BUNDLE; audio
        `CN/48000`, `OPUS/48000/2`, RED, G722, PCMU, PCMA, CN and telephone-event with
        `a=x-ssrc-range:1000-1000`; video `H264/90000`
        `profile-level-id=42C01E;packetization-mode=1;max-mbps=108000;max-fs=3600;max-br=2000;max-fps=3000`
        plus RTX, `b=AS:2400`, a 100-SSRC range per line; screen share adds AV1; session
        `b=CT:10000000`, `a=x-plaza-msi-range:1-100 101-200`,
        `a=x-mediabw:main-video send=8100;recv=8100`. Voicemail answered a 1:1 call without BUNDLE,
        without Opus and with video rejected (port 0).

        **MP renegotiation offer to an SDES leg** (the example below, recorded by the bridge after a
        lobby admission, keys and addresses replaced): `RTP/AVP` with both a DTLS fingerprint and SDES
        keys, the same five key attributes on every m-line (`a=cryptoscale:1 server
        AES_CM_128_HMAC_SHA1_80 ...|2^31|1:1`, `a=crypto:2` and `3` AES-CM with and without MKI,
        `a=crypto:4` and `5` `AEAD_AES_256_GCM`), mids renumbered as in the table, candidates only on
        mids 1-4, audio offering `x-much3`, `x-much2`, `SATINFB`, `SATIN`, `SILK`, `OPUS`, `G722`,
        `SIREN`, `G729`, PCMU, PCMA, RED, telephone-event and CN, and video `x-h264uc`, `H264`
        (`profile-level-id=42C02A`), `H265v2`, `x-ulpfecuc` and RTX; `a=x-multi-stream` on mids 13 and
        3; `a=x-data-protocol:rtp sctp` on the data line.

        **ost's 1:1 offer**: SDES, no BUNDLE, one ICE agent per m-line, audio PCMU only and video
        `X-H264UC/90000` (`packetization-mode=1;mst-mode=NI-TC`) with `x-rtvc1` and `x-ulpfecuc` listed;
        ost's README marks video as work in progress.
