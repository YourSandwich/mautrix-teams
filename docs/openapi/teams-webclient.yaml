    MediaDescriptions:
      type: object
      description: The send-capable m-lines and their direction; see `updateMediaDescriptions`.
      properties:
        descriptions:
          type: array
          items:
            type: object
            required: [mid, direction]
            properties:
              mid:
                type: string
              direction:
                type: string
                enum: [sendrecv, sendonly, recvonly]
              label:
                type: string
                enum: [main-video, applicationsharing-video]
        negotiationTag:
          type: string
          description: '`<participantId>;v_<n>` or `<participantId>;ss_1`; absent in the first offer.'
        requestId:
          type: integer
          description: Increments per change; echoed as `mdRequestId` in the roster.
      x-evidence:
        - "captured: consumer/calling"
        - "captured: enterprise/called"
    MediaNegotiationOffer:
      type: object
      description: |
        Body of `call/mediaRenegotiation/` under `mediaNegotiation`. The bridge reads
        `links.mediaAnswer`, `mediaContent.blob` and `mediaContent.mediaLegId`; its test fixture also
        has `links.rejection` and `mediaContent.newOffer: true`. No web-client capture recorded the
        offer itself.
      properties:
        links:
          type: object
          properties:
            mediaAnswer:
              type: string
              description: Where to post `MediaAnswerRequest` (`.../cc/v1/negotiations/<id>/.../answer`).
            rejection:
