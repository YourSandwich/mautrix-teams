        `callModalities` and `callDirection` plus a `callInvitation`, which makes them ring; a `28:`
        bot gets an empty `participantInvitationData` and no `callInvitation`, as in ost's Echo bot
        invite. The bridge always uses `["Audio"]`; ost adds `Video` with a camera.
      security:
        - aadIc3: []
      parameters:
        - $ref: '#/components/parameters/CallChainId'
        - $ref: '#/components/parameters/CallMessageId'
        - $ref: '#/components/parameters/CallSkypeClient'
        - $ref: '#/components/parameters/RefererTeams'
        - $ref: '#/components/parameters/CallTeamsPartition'
        - $ref: '#/components/parameters/CallTeamsRegion'
        - $ref: '#/components/parameters/CallTeamsRing'
        - $ref: '#/components/parameters/CallMigration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationAddRequest'
      responses:
        '2XX':
          description: Accepted; the body is ignored.
        default:
          description: Any status >= 300 fails the call (ost aborts on any non-2xx).
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/calls.go:Call.place"
        - "pkg/msteams/calls.go:Call.addBody"
        - "ost@0892144 src/calling/signaling.rs:1095-1199"
        - "ost@0892144 src/calling/signaling.rs:817-860"
  /leave:
    servers:
      - url: '{conversationController}'
        description: The conversation controller URL from `callCreate`, with `/leave` inserted as for `/add`.
        variables:
          conversationController:
            default: https://conversation-controller.invalid/conv/EXAMPLE
        x-bridge-usage: used
        x-evidence:
          - "pkg/msteams/calls.go:insertPath"
    post:
      tags: [calling]
      operationId: callLeave
      summary: Hang up (step 4)
      description: |
        How the web client ends every call in the HAR capture of 2026-09-26, answered 204. The
        bridge uses it for the caller's hangup and when setup fails after `callCreate` returned a
        controller. The acceptance carries no `end` link; the earlier `callLeg/end` guess
        answered 404. Headers as for `callCreate`, with a fresh message id and `x-ms-migration`.
      security:
        - aadIc3: []
      parameters:
        - $ref: '#/components/parameters/CallChainId'
        - $ref: '#/components/parameters/CallMessageId'
        - $ref: '#/components/parameters/CallSkypeClient'
        - $ref: '#/components/parameters/RefererTeams'
        - $ref: '#/components/parameters/CallTeamsPartition'
        - $ref: '#/components/parameters/CallTeamsRegion'
        - $ref: '#/components/parameters/CallTeamsRing'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participants, conversationTransactionEnd, callTransactionEnd]
              properties:
                participants:
                  type: object
                  description: '`from` exactly as sent in `callCreate`.'
                conversationTransactionEnd:
                  type: object
                  example: {reason: noError, code: 0, phrase: ConversationEndNoModalityConnected}
                callTransactionEnd:
                  type: object
                  example: {code: 0, subCode: 0, phrase: CallEndReasonLocalUserInitiated, resultCategories: [Success]}
      responses:
        '204':
          description: Left the call.
        default:
          description: Any status >= 300 is reported as a failed hangup.
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/calls.go:Call.Hangup"
        - "pkg/msteams/calls.go:PlaceCall"
components:
