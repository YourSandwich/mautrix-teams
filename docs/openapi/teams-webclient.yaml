      name: RegistrationToken
      description: |
        Header `RegistrationToken` with the value `registrationToken=<skype token>`. `http.go` still
        supports it (`AuthRegistration`), but no request in this description uses it.
      x-evidence:
        - "pkg/msteams/http.go:attachAuth"
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      description: '`common`, `organizations`, `consumers`, or a tenant GUID.'
      schema:
        type: string
        example: common
    ConversationId:
      name: conversationId
      in: path
      required: true
      description: |
        Thread id. For a reply inside a channel thread the bridge sends
        `<threadId>;messageid=<rootMessageId>`, escaped as one segment, so the `;` goes out as `%3B`.
        The code comment on `SendMessage` claims `:` and `@` get encoded too; Go's `url.PathEscape`
        leaves both literal.
      schema:
        type: string
      examples:
        chat:
          value: '19:abc123@thread.v2'
        oneOnOne:
          value: '19:00000000-0000-0000-0000-000000000001_00000000-0000-0000-0000-000000000002@unq.gbl.spaces'
        channelReply:
          value: '19:abc123@thread.tacv2;messageid=1700000000000'
    ThreadId:
      name: threadId
      in: path
      required: true
      description: Thread id, path-escaped.
      schema:
        type: string
        example: '19:abc123@thread.v2'
    MessageId:
      name: messageId
      in: path
      required: true
      description: Server message id (millisecond epoch string).
      schema:
        type: string
        example: '1700000000000'
    View:
      name: view
