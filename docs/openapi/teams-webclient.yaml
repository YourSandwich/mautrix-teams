          required: false
          description: Empty on the first connect.
          schema:
            type: string
        - name: dom
          in: query
          required: false
          description: '`teams.live.com` on the consumer calling socket, `teams.cloud.microsoft` on the enterprise one, `outlook.office.com` on the embedded calendar''s.'
          schema:
            type: string
        - name: cor_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: con_num
          in: query
          required: true
