        - "captured: enterprise/calendar"
  /trap/tokens:
    servers:
      - url: https://teams.microsoft.com
        description: Work.
      - url: https://edge.skype.com
        description: Consumer.
    get:
      tags: [calling]
      operationId: getRelayTokens
      summary: Fetch media relay credentials
      description: |
        Both web clients call this once at start-up with `x-skypetoken` (the consumer client adds
        `x-ms-migration: True`). The answer holds `realm` (`"rtcmedia"`, quotes included),
        `username` and `password` entries and `expires` 604800 (seconds, presumably). The shape reads
        like long-term TURN credentials; which relay they are for and how the clients use them is not
        visible, since the captured calls relied on the media processor's own relay candidates. ost
        guesses a different endpoint (`POST .../api/v2/ep/relay/token`) that no capture shows.
      security:
        - skypetokenHeader: []
      responses:
        '200':
          description: Credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayTokensResponse'
      x-bridge-usage: documented-only
      x-evidence:
        - "captured: enterprise/calls"
        - "captured: consumer/login"
        - "ost@0892144 src/calling/turn.rs:69-150"
  /attach:
    servers:
      - &forkedCall
        url: '{forkedCallLeg}'
        description: |
          A link of an incoming ring's `callNotification.links`, which purple-teams' sample shows as
          `.../cc/v1/forked/<id>/.../{attach,progress,reject}` on the FlightProxy, next to
          `mediaAnswer: "cc://ma"` and `udpTransport: "udp://<ip>:3478/"`.
        variables:
          forkedCallLeg:
            default: https://api.flightproxy.teams.microsoft.com/api/v2/ep/cc-example-01-prod-aks.cc.skype.com/cc/v1/forked/00000000-0000-4000-8000-0000000000d2/1/a1/1
    post:
      tags: [calling]
      operationId: incomingCallAttach
      summary: Incoming call, attach
      description: |
        Every endpoint of the callee attaches about 60 ms after the ring, before anyone answers,
        with `X-Skypetoken`, `x-ms-migration: True`, the ring's `callId` as chain id and the
        `ms-teams-*` headers. The body is
        `{"attach": {"requireMediaContent": false, "links": {"end": <callback>/call/end/}, "locationContent": null, "networkContent": null, "areaContent": null}, "capabilities": null, "endpointCapabilities": 73463, "additionalActions": [{"name": "join", "url": <conversationController>, "waitForResponse": true, "input": {"conversationRequest": {"roster": {"type": "Delta", "rosterUpdate": ...}, "links": {conversationEnd, conversationUpdate, localParticipantUpdate, addParticipantSuccess, addParticipantFailure, receiveMessage}}, "endpointMetadata": {}, "participants": {"from": {id, displayName, endpointId, participantId: <ring's to.participantId>, languageId}}}}]}`
        (`requireMediaContent` is false because the offer came in the ring). The 200 answer holds
        `callInvitation.links` (`progress`, `newOffer`, `mediaAnswer`, `acceptance`, `redirection`,
        `callLeg`, `subscribe`, `brokerHttpTransport`, on `.../cc/v1/incoming/...`) and the join's
        output (roster, conversation links). The client then posts
        `{"callProgress": {"sender": <from>, "status": "ringing", "phrase": "ringing"}}` to
        `progress` (202). When the caller gives up or another endpoint answers, Teams posts to the
        `end` link. The bridge attaches and reports ringing the same way.
      security:
        - skypetokenHeader: []
      responses:
        '200':
          description: The call invitation's links and the join's output.
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/incoming.go:Client.AttachCall"
        - "captured: enterprise/incoming1to1"
  /accept:
    servers:
      - url: '{incomingCallLeg}'
        description: The `acceptance` link from the attach answer's `callInvitation.links`.
        variables:
          incomingCallLeg:
            default: https://api.flightproxy.teams.microsoft.com/api/v2/ep/cc-example-01-prod-aks.cc.skype.com/cc/v1/incoming/00000000-0000-4000-8000-0000000000d3/27/t/1422
    post:
      tags: [calling]
      operationId: incomingCallAccept
      summary: Incoming call, accept
      description: |
        Sent when the user answers, about half a second after an `updateEndpointState` with
        `isMuted: false`: `{"callAcceptance": {"acceptedBy": <from>, "acceptedCallModalities": ["Audio"], "capabilities": null, "endpointCapabilities": 73463, "clientEndpointCapabilities": 47150826, "links": {mediaRenegotiation, transfer, replacement, balanceUpdate, retargetCompletion, controlVideoStreaming, updateMediaDescriptions}, "clientContentForMediaController": {controlVideoStreaming, csrcInfo}, "mediaContent": {"blob": <answer>, "contentType": "application/sdp-ngc-1.0", "mediaLegId": <the offer's>, ...}, "pstnContent": {...}, "callKeepAliveInterval": null}}`.
        The blob answers the caller's offer in its dialect: `a=setup:active`, the answerer's own
        fingerprint and candidates, audio `sendrecv` bundled, and the lines it doesn't take
        inactive or with port 0. The 200 answer carries `callAcceptanceAcknowledgement.links`
        (`callLeg`, `mediaRenegotiation`, `controlVideoStreaming`, `updateMediaDescriptions` and
        more, as on an outgoing call's acceptance); the callee gets no `call/acceptance` callback.
        The bridge answers audio alone, runs DTLS as the client and keys SRTP from it.
      security:
        - skypetokenHeader: []
      responses:
        '200':
          description: The acknowledgement's links.
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/incoming.go:Call.Accept"
        - "pkg/teamsmedia/dtls.go:transport.handshakeDTLS"
        - "captured: enterprise/incoming1to1"
  /reject:
    servers:
      - *forkedCall
    post:
      tags: [calling]
      operationId: incomingCallReject
      summary: Incoming call, reject (request not captured)
      description: |
        **Not captured.** Named by the ring payload's `links.reject`. The web client's
        `rejectIncomingCall` sends a DELETE to the attach answer's `callInvitation.links.callLeg`
        with `{"callEnd": {"code": 603, "subCode": 0, "phrase": "CallEndReasonLocalUserInitiated", "resultCategories": ["Success"]}}`
        (read in its code). Whether one endpoint's decline ends the call on the others is unknown,
        so the bridge sends nothing when the user declines in Matrix and only stops ringing there.
      security:
        - skypetokenHeader: []
      responses:
        default:
          description: Not captured.
      x-bridge-usage: documented-only
      x-evidence:
        - "purple-teams@f7eb519 teams_trouter.c:254-318"
