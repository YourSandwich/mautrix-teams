        description: |
          The bridge POSTs to `regionGtms.calling_conversationServiceUrl` verbatim and refuses to
          call when authz did not advertise it (observed
          `https://api-emea.flightproxy.teams.microsoft.com/api/v2/epconv`, the same URL the
          enterprise web client used). ost falls back to `calling_potentialCallRequestUrl` cut before
          `/api/v2/` plus `/api/v2/epconv`. The URL is split into this base and `/epconv` only to fit
          OpenAPI.
