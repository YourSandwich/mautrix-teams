  /updateMediaDescriptions:
    servers:
      - url: '{callLeg}'
        description: |
          `callAcceptance.links.callLeg`, for example
          `https://api.flightproxy.teams.microsoft.com/api/v2/ep/cc-<cluster>-prod-aks.cc.skype.com/cc/v1/active/<call id>/<n>/a3/<n>?i=<node>&e=<n>`;
          `links.updateMediaDescriptions` equals `{callLeg}/updateMediaDescriptions` (checked in the
          capture). After a renegotiation the joiner's call-leg requests go to its own call controller
          while conversation requests stay with the meeting's controller.
        variables:
          callLeg:
            default: https://api.flightproxy.teams.microsoft.com/api/v2/ep/cc-example-01-prod-aks.cc.skype.com/cc/v1/active/00000000-0000-4000-8000-0000000000d1/13/a3/477?i=192-0-2-11&e=638000000000000001
    post:
      tags: [meetings]
      operationId: updateMediaDescriptions
      summary: Turn the camera or screen share on or off
      description: |
        Camera and screen share never renegotiate SDP: the client flips pre-negotiated m-lines. The
        body lists the send-capable mids with their direction; the camera line goes `sendrecv` with
        `label: main-video`, the screen-share line `sendonly` with `label: applicationsharing-video`,
        everything else `recvonly`. `requestId` increments per change and reappears as the roster
        streams' `mdRequestId`; `negotiationTag` is `<participantId>;v_<n>` after camera changes
        (`v_2` on, `v_1` off) and `<participantId>;ss_1` after starting a screen share (the consumer
        client drops the tag when sharing stops, the enterprise client keeps `;ss_1`). The mids are
        those of the current SDP: before a renegotiation the camera is mid 1 and screen share mid 11,
        after one camera 2 and screen share 3. Before turning the camera on the client posts
        `applyChannelParameters`. Answered 200 with a `TransactionResult` (`code: 0`,
        `phrase: Success.`).

        The bridge switches its camera the same way (`SetCamera`): it takes the link from the
        acceptance's or the `call/mediaAcknowledgement/` callback's `links`, lists the answered main
        video mids (camera first) and sends `<random uuid>;v_2` / `;v_1` as the tag.
