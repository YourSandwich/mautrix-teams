      x-scope: https://chatsvcagg.teams.microsoft.com/.default offline_access
      x-evidence:
        - "pkg/msteams/auth.go:csaOAuthScope"
        - "pkg/msteams/contacts.go:listTeamsRequest"
    aadOutlookSearch:
