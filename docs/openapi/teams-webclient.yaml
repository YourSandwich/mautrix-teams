    post:
      tags: [calling, meetings]
      operationId: callCreate
      summary: Create a call or meeting conversation (work accounts)
      description: |
        Creates the conversation every call and meeting lives in and returns its controller, the URL
        all later conversation requests go to. The body variants (`ConversationCreateRequest`):

        | Case | Body | Then |
        |---|---|---|
        | outgoing call, bridge and ost | `callInvitation` with the SDP offer, `groupChat.threadId` = the 1:1 thread, `participants.to: []` | `callAddParticipant` rings the callee |
        | outgoing 1:1 call, web client | `callInvitation`, `participants.to: [{id, participantId}]`, `groupChat: null`, `suppressDialout: false` | no `/add`; answered with conversation type `Default`, `isMultiParty: false` |
        | Echo test call, web client | `callInvitation`, `conversationRequest.scenario: UserInitiatedTestCall`, `to: []`, `groupChat: null` | `/add` of the Echo bot with `groupChat.threadId: 19:preview-<uuid>`; type `AdHocMeeting` |
        | join a meeting of the own tenant (organizer or invitee) | no `callInvitation`; `groupChat {threadId: <meeting chat>, messageId: "0"}`, `meetingInfo {tenantId, organizerId}` | `joinConversationMedia` |
        | join any meeting by code or link | no `callInvitation`; `groupChat: null`, `meetingInfo: null`, `meetingData {meetingCode, passcode, meetingUrl}`, `meetingPreferences {shouldResurrect: resurrect}` | `joinConversationMedia` with the response's `meetingData` |

        `tenantId` and `organizerId` come from the meeting chat's `meeting` thread property, the join
        link's `context={"Tid","Oid"}` or `awareness_conversationLiveState:0.meetingInfo`; code and
        passcode from the short link `.../meet/<code>?p=<passcode>` or the live state's
        `meetingData`. A code join into a meeting that is already running returns the existing
        controller (also across clouds: a work account joining a personal account's meeting got a
        `https://api.flightproxy.skype.com/api/v2/cp/...` controller), the meeting's
        `state.groupCallInitiator`, `meetingDetails.isPresenterConnected`, a 6-character passcode in
        `meetingData` that the media request has to use, a reduced link set, and a `roster` holding
        only the joiner, under `lobby`.

        Every callback URL in the body is a Trouter URL
        `<surl>callAgent/<callAgentId>/<8 hex>/<path>` (see `call-control-callbacks` in
        `trouterWebSocket`); callbacks can arrive before the response, so the bridge registers the
        call first. The bridge offers audio only (`callModalities: ["Audio"]`, SDES,
        `contentType: application/sdp`) and sets `pstnContent.platformName` to `mautrix-teams`; the
        web clients offer `["Audio","ScreenViewer"]` (or `["Audio","Video","ScreenViewer"]` with the
        camera on) with a 13-m-line DTLS SDP as `application/sdp-ngc-1.0` plus `mediaDescriptions`,
        `applyChannelParameters`, `mediaLegId` and `clientLocation`, and put their full
        `x-microsoft-skype-client` string into `platformName`. The capability integers differ:
        `endpointCapabilities` is always 73463; `clientEndpointCapabilities` is 9336554 (bridge, ost),
        47150826 (web client calls), 63911658 or 63928042 (web client meetings). No source explains
        them.

        Headers: the bridge sends `Authorization: Bearer <IC3>` and `X-Skypetoken`; the web client's
        bearer is stripped from the capture and it sends `x-skypetoken`. Both send the `ms-teams-*`
        headers (the bridge takes region and partition from authz), a call-constant chain id and a
        fresh message id per request (the bridge reuses the create's message id for nothing else).
        Response headers: `content-type: application/vnd.skype.gvc.v1.0+json`,
        `location: <controller>`, `x-microsoft-skype-conversation-type` (`AdHocMeeting`, `Default`,
        `ScheduledMeeting`), `x-microsoft-skype-proxy-cluster-context` (a call-controller URL).
      security:
        - aadIc3: []
          skypetokenHeader: []
        - skypetokenHeader: []
      parameters:
        - $ref: '#/components/parameters/CallChainId'
        - $ref: '#/components/parameters/CallMessageId'
        - $ref: '#/components/parameters/CallSkypeClient'
        - $ref: '#/components/parameters/RefererTeams'
        - $ref: '#/components/parameters/CallTeamsPartition'
        - $ref: '#/components/parameters/CallTeamsRegion'
        - $ref: '#/components/parameters/CallTeamsRing'
        - $ref: '#/components/parameters/CallMigration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
            examples:
              bridgeCall:
                $ref: '#/components/examples/BridgeCallCreate'
              meetingJoin:
                $ref: '#/components/examples/MeetingConversationCreate'
              codeJoin:
                $ref: '#/components/examples/CodeJoinConversationCreate'
      responses:
        '2XX':
          description: |
            201 for a new conversation, 200 when joining a running one. The bridge reads the body up to
            1 MiB and takes the controller from `conversationController`, else
            `conversationResponse.conversationController`, else the `Location` header; without any of
            them the call fails. It also keeps `state.groupCallInitiator`, merges `roster`, and for a
            code join keeps `meetingData` for the media request.
          headers:
            Location:
              description: The conversation controller URL.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
              examples:
                codeJoin:
                  $ref: '#/components/examples/CodeJoinConversationResponse'
        default:
          description: Any status >= 300 fails the call with the body (ost aborts on any non-2xx).
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/calls.go:PlaceCall"
        - "pkg/msteams/calls.go:JoinMeeting"
        - "pkg/msteams/calls.go:JoinMeetingByCode"
        - "pkg/msteams/calls.go:Call.createConversation"
