    servers:
      - url: '{brokerBase}'
        description: |
          `links.subscribe` of the conversation, for example
          `https://api.flightproxy.teams.microsoft.com/api/v2/ep/broker-<cluster>-prod-aks.broker.skype.com/api/v1/subscribe/<uuid>/0?i=<node>`.
        variables:
