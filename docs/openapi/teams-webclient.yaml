        | enterprise web client, `TeamsCDL` | `unifiedPresenceService`, `tpsUpdate/calendar` |
        | embedded Outlook calendar, `M365Calendar` (`dom=outlook.office.com`) | `calendar` |
        | consumer web client, `TeamsCDL` on `go.trouter.skype.com` | `messaging`, `unifiedPresenceService` |
        | consumer web client, `SkypeSpaces` on `go.trouter.teams.microsoft.com` (`dom=teams.live.com`) | `callAgent/...` |
