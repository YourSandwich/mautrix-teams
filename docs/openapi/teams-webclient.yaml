          enum: [1fec8e78-bce4-4aaf-ab1b-5451cc387264, 8ec6bc83-69c8-4392-8f08-b3c986009232, 4b3e8f46-56d3-427f-b1e2-d239b2ea6bca, 5e3ce6c0-2b1f-4285-8d4b-75ee78787346]
        grant_type:
