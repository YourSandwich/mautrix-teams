    IdTokenClaims:
      type: object
      description: |
        Subset of standard AAD id_token claims the bridge reads. A personal account's id_token has
        `tid` `9188040d-6c67-4c5b-b112-36a304b66dad` and an `oid` whose last 16 hex digits are the
        account's CID.
      properties:
        tid:
          type: string
          description: Tenant id; `9188040d-6c67-4c5b-b112-36a304b66dad` means a Microsoft (consumer) account.
          example: 00000000-0000-0000-0000-0000000000aa
        oid:
          type: string
          example: 00000000-0000-0000-0000-000000000001
