        - "captured: consumer/login"
    AuthzResponse:
      type: object
      description: |
        Two shapes. Work (`authorizeWork`): `tokens.skypeToken` plus `region`, `partition`,
        `userRegion`, `userPartition`, `regionGtms`, `regionSettings`, `licenseDetails`. Consumer
        (`authorizeConsumer`, `authorizeConsumerV2`): `skypeToken.skypetoken` plus `regionGtms`,
        `regionSettings`, `consumerLicenseDetails`, and no `tokens`, `region` or `partition`. The
        bridge reads `tokens.skypeToken` first and falls back to `skypeToken.skypetoken`.
      properties:
        tokens:
          type: object
          description: Work shape.
          properties:
            skypeToken:
              type: string
              description: The skype token (a JWT, which ost decodes to find the caller's MRI).
              example: eyJ...example
            expiresIn:
              type: integer
              description: Seconds (about one day; teams-api's fixture has 86397).
              example: 86397
            tokenType:
              type: string
        skypeToken:
          type: object
          description: Consumer shape.
          properties:
            skypetoken:
              type: string
              example: eyJ...example
            expiresIn:
              type: integer
              example: 28799
            skypeid:
              type: string
              description: '`live:.cid.<cid>`; the account''s MRI is `"8:" + skypeid`.'
              example: live:.cid.0123456789abcdef
            signinname:
              type: string
              description: The account's display name.
              example: Alex Example
            isBusinessTenant:
              type: boolean
              example: false
        region:
          type: string
          description: Also sent as `ms-teams-region` on call control.
          example: emea
        partition:
          type: string
          description: |
            Formatted `<region><nn>` per the code comment, e.g. `amer03`; teams-api's fixture has
            `emea01`. Also sent as `ms-teams-partition` on call control.
          example: amer03
        userRegion:
          type: string
          description: Can be a country code such as `at` that `region` does not reveal.
          example: at
        userPartition:
          type: string
        regionGtms:
          $ref: '#/components/schemas/RegionGtms'
        regionSettings:
          type: object
          description: 'Not read by the bridge. Consumer example: `isUnifiedPresenceEnabled`, `isOutOfOfficeIntegrationEnabled`, `isContactMigrationEnabled`, `isAppsDiscoveryEnabled`, `isFederationEnabled`.'
          additionalProperties:
            type: boolean
          x-bridge-usage: documented-only
          x-evidence:
            - "teams-api@60cd5c1 pkg/authz.go:74-80"
            - "captured: consumer/login"
        licenseDetails:
          type: object
          description: '`isFreemium`, `isBasicLiveEventsEnabled`, `isTrial`, `isAdvComms` in teams-api''s fixture; not read by the bridge.'
          x-bridge-usage: documented-only
          x-evidence:
            - "teams-api@60cd5c1 pkg/auth_test.go:11"
        consumerLicenseDetails:
          type: object
          description: |
            Consumer only. `teamsFree` and top-level copies of `maxMeetingDurationMinutes` (60),
            `maxMeetingParticipants` (100), `copilotEnabled`, `callRecordingEnabled`,
            `premiumMeetingOptionsEnabled`, `decorateMeetingBackgroundEnabled`,
            `intelligentRecapEnabled`, plus `hasTeamsLicense` and `licenseVersionTimestamp`.
          additionalProperties: true
          x-bridge-usage: documented-only
          x-evidence:
            - "captured: consumer/login"
      x-evidence:
        - "pkg/msteams/auth.go:authzResponse"
        - "teams-api@60cd5c1 pkg/auth_test.go:11"
        - "pkg/msteams/auth.go:lokiPrefixFor"
        - "pkg/msteams/calls.go:Call.request"
        - "teams-api@60cd5c1 pkg/authz.go:89-96"
        - "ost@0892144 src/calling/call_test.rs:1783-1816"
        - "captured: consumer/login"
