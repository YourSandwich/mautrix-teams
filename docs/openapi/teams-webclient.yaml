          schema:
            type: string
            example: '1'
        - name: x-ms-client-version
          in: header
          required: true
          description: The bridge sends `49/25113001312` (purple-teams' work client version); Squads `1415/25040319109`.
          schema:
            type: string
            example: 49/25113001312
        - name: x-ms-endpoint-id
          in: header
          required: true
          description: Trouter endpoint id.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresenceSubscriptionRequest'
      responses:
        '2XX':
          description: Subscribed; up to 1 KiB of the body is read and discarded. Pushes follow as the `presence` frame of `trouterWebSocket`.
