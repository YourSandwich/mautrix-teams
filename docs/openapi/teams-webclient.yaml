        **OpenAPI cannot describe websocket traffic.** Everything after the upgrade is listed in
        `x-websocket-frames`: socket.io 0.9 text frames `<type>:<id>[+]:<endpoint>:<payload>`,
        where type `1` = connect, `2` = heartbeat, `3` = message (Trouter's HTTP-over-websocket
        requests and their answers), `5` = event, `6` = ack. The bridge splits a frame after its
        third `:`.

        Services never push to this socket directly. They POST to a Trouter URL under `surl`; Trouter
        forwards that request as a `3:::` frame whose `url` is the path the service used. Which paths
        a client gets pushes on is decided by the registrar (`registerTrouterApp`), by subscriptions
        such as presence, and by the callback links a client puts into call-control requests.

