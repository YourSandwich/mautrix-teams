        - "pkg/msteams/messages.go:isChatMessage"
        - "purple-teams@f7eb519 teams_messages.c:1711-1716"
        - "teams-api@60cd5c1 resources/chatsvcagg/messages/messages-1.json"
    post:
      tags: [chat-service]
      operationId: sendMessage
      summary: Send a message or a typing indicator
      description: |
        Messages: `SendMessageRequest` is what the bridge sends. The comment on `sendMessageRequest`
        records that Teams answered 201 but silently dropped delivery when fields it does not set
        (`type`, `from`, `composetime`, ...) were present, even as empty strings, so the bridge omits
        every unset field. Both captured web clients send the full `WebClientMessageRequest` instead
        (`id: "-1"`, `type`, `conversationid`, `conversationLink: "blah/<thread>"`, `from`,
        `fromUserId`, `composetime`, `originalarrivaltime`, a random 19-digit `clientmessageid`, and
        `properties` with every key present, the list-valued ones as JSON strings), and so does Squads;
        they post to the `chatServiceAfd` front door, the bridge to `chatService` for work logins.
        Which difference caused the drops is not verified.

        A file shared from OneDrive goes out as its own message with empty `content` and
        `properties.files` holding the `FileCard` list as a JSON string, followed by a separate text
        message when the user typed one (captured). The bridge sends the cards with the text in one
        message.

        A reply inside a channel thread goes to `<threadId>;messageid=<rootMessageId>` (see
        `conversationId`). The bridge remembers `clientmessageid` so the Trouter echo of its own send
        is dropped.

        Typing: `TypingRequest`. The code notes that Teams ignores the POST when `contenttype` is
        `text`, hence `Application/Message`. purple-teams sends the same body, delays the first
        event by 2 s, sends at most one per 20 s, and never sends `Control/ClearTyping`.
      security:
        - skypetokenAuthentication: []
        - skypetokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SendMessageRequest'
                - $ref: '#/components/schemas/WebClientMessageRequest'
                - $ref: '#/components/schemas/TypingRequest'
            examples:
              bridgeText:
                summary: The bridge's HTML message with a mention
                value:
                  clientmessageid: '1790000000000'
                  content: '<p>hello <span itemscope="" itemtype="http://schema.skype.com/Mention" itemid="0">Sam Sample</span></p>'
                  messagetype: RichText/Html
                  contenttype: text
                  imdisplayname: Alex Example
                  properties:
                    mentions: '[{"@type":"http://schema.skype.com/Mention","itemid":0,"mri":"8:orgid:00000000-0000-0000-0000-000000000002","mentionType":"person"}]'
              webClientText:
                $ref: '#/components/examples/WebClientTextMessage'
              webClientFileCard:
                $ref: '#/components/examples/WebClientFileCardMessage'
              typing:
                value:
                  content: ''
                  contenttype: Application/Message
                  messagetype: Control/Typing
      responses:
        '201':
          description: |
            Accepted (the bridge accepts any 2xx). For a message, `OriginalArrivalTime` becomes the
            message id; without it the bridge falls back to its `clientmessageid`. The body is ignored
            for typing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '401':
          $ref: '#/components/responses/SkypeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/OtherError'
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/messages.go:SendMessage"
        - "pkg/msteams/messages.go:buildProperties"
        - "pkg/msteams/messages.go:SendTyping"
        - "pkg/connector/handlematrix.go:TeamsClient.HandleMatrixMessage"
        - "purple-teams@f7eb519 teams_messages.c:2786-2796"
        - "purple-teams@f7eb519 teams_messages.c:2540-2579"
        - "Squads@f977552 src/main.rs:434-467"
        - "captured: enterprise/fileupload"
        - "captured: consumer/login"
