    post:
      tags: [presence]
      operationId: presenceSubscribe
      summary: Subscribe to presence pushes over Trouter
      description: |
        Pushes go to `trouterUri`, so the bridge needs a connected Trouter socket first (no `surl`
        is an error). It sends at most 100 MRIs per request and remembers the whole set; every Trouter
        `1::` connect re-posts it, since the socket address changes. `trouterUri` is
        `<surl>TeamsUnifiedPresenceService` (`surl` already ends in `/`). Not available for consumer
        accounts (no presence token). The connector subscribes only the `8:orgid:` partners of 1:1
        chats.

        purple-teams does the same with 100 MRIs every 50 ms, skips PSTN numbers, and waits for `surl`
        (five retries 2 s apart, then it polls with `presenceGet` instead); it concatenates
        `<surl>/TeamsUnifiedPresenceService`, so its URI contains `//`. Squads uses
        `<surl>/unifiedPresenceService`, tags each MRI with `source: ups`, and subscribes each time
        its Trouter socket reports connected. The bridge sends no skype-token fallback, which
        purple-teams uses when it has no presence token.

        Both web clients send `trouterUri: <surl>unifiedPresenceService` (no double slash) and tag each
        MRI with `source: ups`; the consumer client subscribes its own MRI with
        `shouldPurgePreviousSubscriptions: true`. The answer is `PresenceSubscriptionResponse`
        (`addStatuses[{mri, source, status: 20200}]`, `removeStatuses`), and a snapshot push follows
        on Trouter.
