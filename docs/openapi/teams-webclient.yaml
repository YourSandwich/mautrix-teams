      type: object
      description: The SDP carrier of offers, answers and acceptances.
      properties:
        contentType:
          type: string
          description: |
            `application/sdp` (bridge, ost), `application/sdp-ngc-1.0` (web clients, media processor
            answers), `application/sdp-ngc-0.5` (purple-teams' ring sample).
          example: application/sdp-ngc-1.0
        blob:
          allOf:
            - $ref: '#/components/schemas/TeamsSdp'
          description: |
            SDP text (`TeamsSdp`), or base64 of raw DEFLATE with a preset dictionary when it does not
            start with `v=`; ost says Teams compresses SDPs of 1201 bytes or more. Every captured blob,
            including 33 KB web-client offers, was plain text; a conversation response reported
            `capabilities.supportsCompressedServicePayload: disabled` for a request that sent
            `capabilities: null`.

            The bridge's offer (`audioSDP`) is one `m=audio` line with `RTP/SAVP`, Opus (PT 111,
            `minptime=10;useinbandfec=1`) when configured and PCMU, `b=CT:99980`, the RTP SSRC declared
            in `a=x-ssrc-range` (the code comment: Teams drops RTP from undeclared SSRCs), `rtcp-mux`,
            `a=label` / `a=x-source` `main-audio`, ICE ufrag, password and gathered UDP candidates, and
            an SDES key `a=crypto:2 AES_CM_128_HMAC_SHA1_80 inline:<30-byte key>|2^31`; no DTLS
            fingerprint, no BUNDLE. The media processor answered it with SDES and, for meetings, with
            Opus (observed on the bridge).

            From an answer or renegotiation offer (`parseRemoteAudio`) the bridge takes the ICE ufrag
            and password of the audio section (session level as fallback), every `a=crypto` or
            `a=cryptoscale` key of the AES-CM suite including an optional MKI (`|<value>:<length>`), the
            first payload type and the Opus payload type, and the component-1 UDP candidates. It
            inflates base64 raw DEFLATE without a dictionary; an SDP compressed with Teams' preset
            dictionary fails, since the bridge does not ship that dictionary.
        mediaLegId:
          type: string
          description: 32 upper-case hex digits (web client offers and media processor answers) or a UUID (the joiner's renegotiation answer); a renegotiation answer echoes the offer's value.
        clientLocation:
          type: string
          description: Country code, e.g. `AT` (web clients).
          x-bridge-usage: documented-only
        mediaDescriptions:
          allOf:
            - $ref: '#/components/schemas/MediaDescriptions'
          x-bridge-usage: documented-only
        applyChannelParameters:
          allOf:
            - $ref: '#/components/schemas/ApplyChannelParametersBody'
          x-bridge-usage: documented-only
        requiredFeatures:
          type: string
          description: '`nonByPass` on the web client''s 1:1 call offer.'
          x-bridge-usage: documented-only
        escalationOccurring:
          type: boolean
          x-bridge-usage: documented-only
        newOffer:
          type: boolean
          x-bridge-usage: documented-only
        fromMixer:
          type: boolean
          description: '`true` when the media processor (a mixer) answers.'
          x-bridge-usage: documented-only
        skipIceReinvite:
