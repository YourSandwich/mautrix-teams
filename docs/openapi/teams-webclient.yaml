openapi: 3.0.3
info:
  title: Microsoft Teams web-client API (mautrix-teams subset)
  version: '2026-09-26'
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |
    Reverse-engineered description of the undocumented HTTP and push APIs behind the Microsoft
    Teams web client, limited to what the mautrix-teams bridge (`pkg/msteams`) sends, plus a few
    endpoints other open-source clients use that matter for planned work.

    **This is not a Microsoft contract.** Every path, header and field here was read out of source
    code (ours or another client's), out of test fixtures captured by another client, or out of one
    observed authz response. Microsoft can change or remove any of it without notice, and shapes
    differ between tenants, regions and client versions. Anything a source did not show is left out
    or marked as unknown. Microsoft Graph is described separately in `graph-teams-v1.0.yaml`.

    ## Conventions

    - `x-bridge-usage` on every operation: `used` means `pkg/msteams` sends this request;
      `documented-only` means another client's source shows it and the bridge does not send it.
      Parameters, properties, servers and frames carry the same marker where they differ from their
      operation.
    - `x-evidence` lists where a claim comes from. `pkg/...:Func` is this repository (function
      names, not line numbers). `<project>@<commit> <file>:<lines>` is another client's source.
      `observed: ...` is the single authz `regionGtms` response recorded from one real tenant.
    - Fields that hold JSON inside a JSON string are `type: string` with `x-embedded-json-schema`
      pointing at the decoded shape.
    - The Trouter websocket cannot be modelled in OpenAPI 3.0. Its frames are listed in the
      `x-websocket-frames` extension of `trouterWebSocket`.
    - URLs that a server hands out at runtime and that clients must treat as opaque (the calling
      links) are modelled as a server whose whole URL is one variable.

    ## Evidence sources

    | Project | Commit | What it contributes |
    |---|---|---|
    | this repository, `pkg/msteams` | working tree | everything marked `used` |
    | EionRobb/purple-teams | `f7eb519` | chat service, Trouter, presence, thread management |
    | eisbaw/ost | `0892144` | calling signalling (outgoing 1:1 flow), Trouter acks |
    | IanTerzo/Squads | `f977552` | presence pubsub via UPS, Trouter envelope, AMS GETs |
    | fossteams/teams-api | `60cd5c1` | authz struct, JSON fixtures of CSA, messages, tenants |

    ## Host discovery

    The bridge starts from fixed defaults and replaces them with URLs from the authz `regionGtms`
    map (`applyAuthzEndpoints`):

    | `regionGtms` key | Service | Default when the key is absent |
    |---|---|---|
    | `chatService` | chat service | `https://apac.ng.msg.teams.microsoft.com` |
    | `middleTier` | middle tier | `https://teams.microsoft.com/api/mt/part/emea-03` |
    | `chatSvcAggAfd` | CSA | `https://teams.microsoft.com/api/csa` |
    | `ams`, then `mediaStream` | AMS | `https://teams.microsoft.com/api/amsMTProd` |
    | `unifiedPresence` | presence | `https://presence.teams.microsoft.com` |
    | `calling_conversationServiceUrl` | call creation (epconv) | none; calls fail without it |

    The authz `region` and `partition` fields go out as the `ms-teams-region` and
    `ms-teams-partition` headers of call-control requests.

    A chat-service base stored with the login is never overwritten. The Loki/Delve host prefix
    (`nam`, `eur` or `apc`) is derived from `userPartition`, `partition`, `userRegion` and `region`
    in that order (`lokiPrefixFor`), defaulting to `nam`.

    ## Tokens

    Every AAD token comes from the refresh-token grant against
    `https://login.microsoftonline.com/<tenant>/oauth2/v2.0/token` with client id
    `1fec8e78-bce4-4aaf-ab1b-5451cc387264` (a Teams client registration; the web client itself uses
    `5e3ce6c0-2b1f-4285-8d4b-75ee78787346`), one scope per request.
    The scope strings, exactly as in `auth.go`:

    | Token | Scope | Used by |
    |---|---|---|
    | skype-spaces bearer | `https://api.spaces.skype.com/.default openid profile offline_access` | authz, middle tier, registrar, Trouter `user.authenticate`, avatar cookie |
    | CSA | `https://chatsvcagg.teams.microsoft.com/.default offline_access` | CSA |
    | search | `https://outlook.office.com/search/.default offline_access` | substrate people search |
    | Loki | `394866fc-eedb-4f01-8536-3ff84b16be2a/.default offline_access` | person card |
    | SharePoint | `https://<sharepoint host>/.default offline_access` | `download.aspx`, chat-file upload and invite |
    | Graph | `https://graph.microsoft.com/.default offline_access` | Graph shares fallback and `GET /me?$select=mySite` (see the Graph spec) |
    | IC3 | `https://ic3.teams.office.com/.default offline_access` | call control |
    | presence | `https://presence.teams.microsoft.com/.default offline_access` | presence subscriptions |

    The skype token comes from authz (`tokens.skypeToken`) and goes out in three different shapes
    depending on the service (a fourth, `RegistrationToken`, is implemented but unused); see
    `components.securitySchemes`. Consumer (Microsoft account) logins skip the CSA, search, Loki,
    SharePoint, Graph, IC3 and presence tokens entirely.

    ## Shared behaviour of chat-service and middle-tier calls

    These go through `doJSON`: `User-Agent` is the configured one (the connector never sets it, so
    `Mozilla/5.0 mautrix-teams`), `Accept: application/json`, and `Content-Type: application/json`
    when there is a body. Tokens within 60 s of expiry are refreshed first. A 401 triggers one
    refresh (authz for skype-token calls, the refresh grant for bearer calls) and one retry. 403, 404
    and 429 map to `ErrForbidden`, `ErrNotFound` and `ErrRateLimited` without a retry. Any other
    status >= 400 surfaces the first 4 KiB of the body. When the caller expects a response body,
    only a 201 or 204 may come back empty; an empty 200 is an error.

    ## Identifiers

    - MRIs: `8:orgid:<AAD object id>` for work accounts, `8:live:<id>` for consumer accounts,
      `28:<id>` for bots, `4:<number>` for PSTN, `48:<name>` for virtual system threads such as
      `48:calllogs` and `48:notifications`. `1:` also occurs in sender URLs.
    - Thread ids: `19:<id>@thread.v2` (group chats; meetings as `19:meeting_<id>@thread.v2`),
      `19:<id>@thread.tacv2` (channels), `19:<oidA>_<oidB>@unq.gbl.spaces` (1:1 chats, the two
      object ids sorted lexicographically). A bare `8:` MRI is also treated as a 1:1 conversation.
    - Message ids and client message ids are millisecond Unix epochs as decimal strings;
      `composetime` and `originalarrivaltime` are ISO 8601.
    - Path segments are escaped with Go's `url.PathEscape`: `:` and `@` stay literal, `;` becomes
      `%3B`.
servers:
  - url: https://{region}.ng.msg.teams.microsoft.com
    description: |
      Regional chat service, taken from `regionGtms.chatService`. Observed value for one tenant:
      `https://at.ng.msg.teams.microsoft.com`. Without authz data the bridge uses `apac`.
    variables:
      region:
        default: apac
        description: Region or country code (`apac` is the bridge default, `at` was observed).
    x-bridge-usage: used
    x-evidence:
      - "pkg/msteams/client.go:DefaultChatSvcBase"
      - "pkg/msteams/auth.go:applyAuthzEndpoints"
      - "observed: regionGtms.chatService"
  - url: https://teams.microsoft.com/api/chatsvc/{geo}
    description: |
      Chat-service proxy on teams.microsoft.com (`regionGtms.chatServiceAfd`, observed
      `https://teams.microsoft.com/api/chatsvc/at`). Squads sends the same `/v1/...` paths here with
      an `https://ic3.teams.office.com/.default` bearer instead of a skype token. The bridge does not
      use it.
    variables:
      geo:
        default: emea
        description: Squads hard-codes `emea`; the observed `chatServiceAfd` used `at`.
    x-bridge-usage: documented-only
    x-evidence:
      - "Squads@f977552 src/api.rs:1543-1552"
      - "Squads@f977552 src/api.rs:1584-1619"
      - "observed: regionGtms.chatServiceAfd"
tags:
  - name: auth
    description: AAD device-code and refresh-token grants, and the authz exchange for a skype token.
  - name: chat-service
    description: Conversations, messages, reactions, read markers and thread management (`/v1/...`).
  - name: ams
    description: Async media service (AMS) objects, used for images, videos, voice messages and files.
  - name: middle-tier
    description: Middle tier (`/api/mt`) - tenants, short profiles, profile pictures.
  - name: csa
    description: Chat service aggregator (CSA) - the joined teams and their channels.
  - name: search
    description: substrate.office.com people search, the Teams people picker.
  - name: people-card
    description: Loki/Delve live persona card - phones, work details, postal addresses.
  - name: sharepoint
    description: Downloading SharePoint/OneDrive files shared in chats.
  - name: trouter
    description: Trouter push service bootstrap and the socket.io websocket that carries all push events.
  - name: registrar
    description: Registration of Trouter paths so services know where to push.
  - name: presence
    description: Unified presence service - pubsub subscriptions delivered over Trouter, and polling (documented-only).
  - name: calling
    description: Call signalling for an outgoing 1:1 audio call, following ost's flow.
paths:
  /{tenant}/oauth2/v2.0/devicecode:
    servers:
      - url: https://login.microsoftonline.com
        description: Microsoft identity platform.
    parameters:
      - $ref: '#/components/parameters/Tenant'
    post:
      tags: [auth]
      operationId: startDeviceCode
      summary: Start a device-code login
      description: |
        First step of the bridge's only interactive login. The connector passes the tenant the user
        typed, or `common` when they typed nothing; `StartDeviceCode` itself falls back to
        `organizations` for an empty tenant. The scope is the skype-spaces scope, so the first access
        token can go straight to authz. No `User-Agent` is set explicitly.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceCodeRequest'
      responses:
        '200':
          description: |
            Device code issued. An `interval` <= 0 is treated as 5 s. A 200 without `device_code` or
            `user_code` is treated as a failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCodeResponse'
        default:
          description: Any status >= 400 aborts the login; up to 8 KiB of the body end up in the error.
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/auth.go:StartDeviceCode"
        - "pkg/connector/login.go:TeamsDeviceCodeLogin.startDeviceCode"
  /{tenant}/oauth2/v2.0/token:
    servers:
      - url: https://login.microsoftonline.com
        description: Microsoft identity platform.
    parameters:
      - $ref: '#/components/parameters/Tenant'
    post:
      tags: [auth]
      operationId: requestToken
      summary: Redeem a device code or a refresh token
      description: |
        Two grants use this endpoint, both with client id `1fec8e78-bce4-4aaf-ab1b-5451cc387264` and
        no client secret.

        - Device-code polling (`PollDeviceCode`): the first poll waits one `interval`; `slow_down`
          adds 5 s. The status code is not inspected: any response carrying `access_token` is
          success, otherwise the `error` field decides.
        - Refresh-token grant (`refreshOAuthToken`): mints every AAD token the bridge uses, one scope
          per request (token table in `info`). The tenant is the login's `tid` claim, `consumers` for
          the Microsoft-account tenant `9188040d-6c67-4c5b-b112-36a304b66dad` (skype-spaces token
          only), or `common` when unknown. A rotated `refresh_token` in the response replaces the
          stored one. A status >= 400 or a non-empty `error` is a failure; `invalid_grant` becomes
          `ErrTokenInvalid`, which ends the login.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/RefreshTokenGrantRequest'
                - $ref: '#/components/schemas/DeviceCodeGrantRequest'
      responses:
        '200':
          description: Token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        default:
          description: |
            OAuth error. Device-code polling handles `authorization_pending` (poll again),
            `slow_down` (poll again 5 s later), `expired_token` / `code_expired` (fail),
            `authorization_declined` / `access_denied` (fail as declined). Anything else fails with
            `error` and `error_description`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/auth.go:PollDeviceCode"
        - "pkg/msteams/auth.go:refreshOAuthToken"
        - "pkg/msteams/auth.go:RefreshAuthToken"
  /api/authsvc/v1.0/authz:
    servers:
      - url: https://teams.microsoft.com
        description: Teams web origin.
    post:
      tags: [auth]
      operationId: authorizeWork
      summary: Exchange the skype-spaces bearer for a skype token and the region map
      description: |
        Used for work and school accounts. Sent with no body and `Accept: application/json; ver=1.0`.
        An expired bearer is refreshed before the call. The response's `regionGtms` repoints the
        chat service, middle tier, CSA, AMS and Loki hosts (see "Host discovery" in `info`).
      security:
        - aadSkypeSpaces: []
      parameters:
        - name: ms-teams-authz-type
          in: header
          required: false
          description: |
            teams-api sends `TokenRefresh`; the bridge sends nothing. Its effect is not shown in any
            source.
          schema:
            type: string
            enum: [TokenRefresh]
          x-bridge-usage: documented-only
          x-evidence:
            - "teams-api@60cd5c1 pkg/authz.go:110-124"
      responses:
        '200':
          description: Skype token and service map. A 200 without `tokens.skypeToken` is `ErrTokenInvalid`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzResponse'
        '401':
          description: Bearer rejected (it can be revoked before its stored expiry). The bridge refreshes the bearer once and retries.
        default:
          description: Any other status >= 400 fails with up to 2 KiB of the body.
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/auth.go:RefreshSkypeToken"
        - "pkg/msteams/auth.go:requestSkypeToken"
        - "pkg/msteams/auth.go:applyAuthzEndpoints"
        - "teams-api@60cd5c1 pkg/authz.go:89-96"
        - "ost@0892144 src/auth/skype.rs:26-50"
  /api/auth/v1.0/authz/consumer:
    servers:
      - url: https://teams.live.com
        description: Teams for personal accounts.
    post:
      tags: [auth]
      operationId: authorizeConsumer
      summary: Consumer-account variant of authz
      description: |
        The bridge calls this instead of `authorizeWork` when the login's tenant is empty or is the
        Microsoft-account tenant, with the same headers and the same skype-spaces bearer (minted
        with the work client id against `consumers`). purple-teams' personal build instead uses the
        personal client id `8ec6bc83-69c8-4392-8f08-b3c986009232` and a separate token for scope
        `service::api.fl.spaces.skype.com::MBI_SSL openid profile offline_access` for this exchange.
        The bridge defines the personal client id as `PersonalOAuthClientID` but never sends it.
        Whether the bridge's token is accepted here is not verified.
      security:
        - aadSkypeSpaces: []
      responses:
        '200':
          description: Same shape as `authorizeWork`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzResponse'
        '401':
          description: The bridge refreshes the bearer once and retries.
        default:
          description: Any other status >= 400 fails with up to 2 KiB of the body.
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/auth.go:requestSkypeToken"
        - "pkg/msteams/auth.go:IsConsumerTenant"
        - "pkg/msteams/auth.go:PersonalOAuthClientID"
        - "purple-teams@f7eb519 teams_login.c:252-263"
        - "purple-teams@f7eb519 teams_login.c:468-480"
  /v1/users/ME/conversations:
    get:
      tags: [chat-service]
      operationId: listConversations
      summary: List the user's conversations
      description: |
        The bridge requests one page (`pageSize=100`) and follows no continuation link; whether the
        server truncates larger accounts is not verified. 1:1 conversations come back without
        `members`, so the bridge derives both peers from the `19:<a>_<b>@unq.gbl.spaces` id.
      security:
        - skypetokenAuthentication: []
        - skypetokenHeader: []
      parameters:
        - name: startTime
          in: query
          required: true
          description: The bridge sends `0`. purple-teams sends a millisecond timestamp to list conversations changed since then.
          schema:
            type: string
            example: '0'
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            example: 100
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/TargetType'
      responses:
        '200':
          description: Conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsResponse'
        '401':
          $ref: '#/components/responses/SkypeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/OtherError'
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/contacts.go:ListChats"
        - "pkg/msteams/contacts.go:convertRawConversation"
        - "purple-teams@f7eb519 teams_messages.c:1907-1922"
  /v1/users/ME/conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [chat-service]
      operationId: listMessages
      summary: Page through a conversation's messages
      description: |
        Backfill. The bridge puts its "before" bound into `startTime` (or `0` for the newest page)
        and pages with the `syncState` it extracts from `_metadata.backwardLink`, falling back to
        `_metadata.syncState`. purple-teams instead treats `startTime` as the lower bound and adds
        `endTime` as the upper bound for older pages; one of the two readings is wrong and neither is
        verified. Only message types the bridge renders survive filtering (`isChatMessage`):
        `Text`, `RichText`, `RichText/Html`, `RichText/UriObject`, `RichText/Media_GenericFile`,
        `RichText/Media_Card`, `RichText/Media_FlikMsg`, `Event/Call`, `RichText/Media_Call`,
        `ThreadActivity/CallStarted`, `ThreadActivity/CallEnded`,
        `ThreadActivity/CallRecordingFinished`, and an empty type.
      security:
        - skypetokenAuthentication: []
        - skypetokenHeader: []
      parameters:
        - name: pageSize
          in: query
          required: true
          description: The bridge defaults to 30.
          schema:
            type: integer
            example: 30
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/TargetType'
        - name: startTime
          in: query
          required: true
          description: '`0`, or the millisecond epoch of the "before" bound.'
          schema:
            type: string
            example: '1700000000000'
        - name: syncState
          in: query
          required: false
          description: Opaque cursor copied from the previous page's `_metadata` link.
          schema:
            type: string
        - name: endTime
          in: query
          required: false
          description: Upper bound (ms epoch) used by purple-teams for older pages; its own comments note the server may ignore it.
          schema:
            type: string
          x-bridge-usage: documented-only
          x-evidence:
            - "purple-teams@f7eb519 teams_messages.c:1778-1809"
      responses:
        '200':
          description: One page of messages, newest first as returned by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryResponse'
        '401':
          $ref: '#/components/responses/SkypeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/OtherError'
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/messages.go:FetchHistory"
        - "pkg/msteams/messages.go:isChatMessage"
        - "purple-teams@f7eb519 teams_messages.c:1711-1716"
        - "teams-api@60cd5c1 resources/chatsvcagg/messages/messages-1.json"
    post:
      tags: [chat-service]
      operationId: sendMessage
      summary: Send a message or a typing indicator
      description: |
        Messages: `SendMessageRequest`. The comment on `sendMessageRequest` records that Teams
        answers 201 but silently drops delivery when fields the web client does not send (`type`,
        `from`, `composetime`, ...) are present, even as empty strings, so the bridge omits every
        unset field. Squads does send those fields, but through the `chatServiceAfd` proxy with an
        IC3 bearer; which difference matters is not verified.

        A reply inside a channel thread goes to `<threadId>;messageid=<rootMessageId>` (see
        `conversationId`). The bridge remembers `clientmessageid` so the Trouter echo of its own send
        is dropped.

        Typing: `TypingRequest`. The code notes that Teams ignores the POST when `contenttype` is
        `text`, hence `Application/Message`. purple-teams sends the same body, delays the first
        event by 2 s, sends at most one per 20 s, and never sends `Control/ClearTyping`.
      security:
        - skypetokenAuthentication: []
        - skypetokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SendMessageRequest'
                - $ref: '#/components/schemas/TypingRequest'
      responses:
        '201':
          description: |
            Accepted (the bridge accepts any 2xx). For a message, `OriginalArrivalTime` becomes the
            message id; without it the bridge falls back to its `clientmessageid`. The body is ignored
            for typing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '401':
          $ref: '#/components/responses/SkypeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/OtherError'
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/messages.go:SendMessage"
        - "pkg/msteams/messages.go:buildProperties"
        - "pkg/msteams/messages.go:SendTyping"
        - "pkg/connector/handlematrix.go:TeamsClient.HandleMatrixMessage"
        - "purple-teams@f7eb519 teams_messages.c:2786-2796"
        - "purple-teams@f7eb519 teams_messages.c:2540-2579"
  /v1/users/ME/conversations/{conversationId}/messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
      - $ref: '#/components/parameters/MessageId'
    put:
      tags: [chat-service]
      operationId: editMessage
      summary: Replace a message's content
      description: |
        Same body as a send, with a fresh `clientmessageid` that the bridge remembers so the Trouter
        echo of the edit is not bridged back.
      security:
        - skypetokenAuthentication: []
        - skypetokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '2XX':
          description: Edited. The body is ignored.
        '401':
          $ref: '#/components/responses/SkypeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/OtherError'
      x-bridge-usage: used
      x-evidence:
        - "pkg/msteams/messages.go:EditMessage"
    delete:
      tags: [chat-service]
      operationId: deleteMessage
      summary: Delete a message
      security:
        - skypetokenAuthentication: []
        - skypetokenHeader: []
      parameters:
        - name: behavior
          in: query
          required: false
          description: Squads sends `softDelete`; the bridge sends no query string.
          schema:
            type: string
            enum: [softDelete]
          x-bridge-usage: documented-only
          x-evidence:
            - "Squads@f977552 src/api.rs:1543-1552"
      responses:
        '2XX':
          description: Deleted. The body is ignored.
        '401':
          $ref: '#/components/responses/SkypeUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
