              $ref: '#/components/schemas/UpdateMediaDescriptionsRequest'
            examples:
              cameraOn:
                value:
                  UpdateMediaDescriptions:
                    mediaDescriptions:
                      descriptions:
                        - {mid: '1', direction: sendrecv, label: main-video}
                        - {mid: '2', direction: recvonly}
                        - {mid: '3', direction: recvonly}
                        - {mid: '4', direction: recvonly}
                        - {mid: '5', direction: recvonly}
                        - {mid: '6', direction: recvonly}
                        - {mid: '11', direction: recvonly}
                      negotiationTag: 00000000-0000-4000-8000-000000000002;v_2
                      requestId: 3
              screenShareOn:
                value:
                  UpdateMediaDescriptions:
                    mediaDescriptions:
                      descriptions:
                        - {mid: '1', direction: recvonly}
                        - {mid: '2', direction: recvonly}
                        - {mid: '3', direction: recvonly}
                        - {mid: '4', direction: recvonly}
                        - {mid: '5', direction: recvonly}
                        - {mid: '6', direction: recvonly}
                        - {mid: '11', direction: sendonly, label: applicationsharing-video}
                      negotiationTag: 00000000-0000-4000-8000-000000000002;ss_1
                      requestId: 4
      responses:
