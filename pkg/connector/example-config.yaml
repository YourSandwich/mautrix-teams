# Displayname template for Teams users. Available variables:
#  .MRI         - The Teams user MRI (e.g. 8:orgid:<guid>)
#  .DisplayName - The name the user has set in Teams
#  .Email       - The email address of the user
#  .JobTitle    - The user's job title (if set)
displayname_template: '{{or .DisplayName .Email .MRI}}'

# Chat name template for Teams chats. Available variables:
#  .ID    - The Teams thread ID
#  .Type  - One of oneOnOne, group, channel, meeting
#  .Topic - The chat topic
chat_name_template: '{{if .Topic}}{{.Topic}}{{else}}Teams chat{{end}}'

# Mute chat portals by default.
mute_chats_by_default: false

# When Teams deletes a message, redact the Matrix counterpart by default. Set
# this to true to instead replace the content with "(deleted)" and keep the
# event in the room. Matrix→Teams deletions are always permanent.
mark_deleted_as_edit: false

# Which Teams thread classes to enumerate on startup. Threads excluded here
# can still surface on demand if a Trouter message arrives in them.
sync_channels:        true   # Team channels (19:...@thread.tacv2)
sync_meeting_chats:   true   # Calendar-driven meeting chats (19:meeting_...) - grouped under a "Meetings" sub-space
sync_system_threads:  false  # 48:notes / 48:notifications / 48:calllogs

# Options for backfilling message history from Teams.
backfill:
    # Number of conversations to fetch when syncing on startup.
    conversation_count: 20
    # Enable message backfill at all.
    enabled: true

# Which presence-like signals Matrix should push up into Teams. Incoming
# (Teams -> Matrix) typing and read receipts are always forwarded; these flags
# only gate the outbound direction. Omit or leave true for the default
# bidirectional behaviour.
presence:
    send_matrix_typing: true
    send_matrix_read_receipts: true
    # Show direct-chat partners' Teams availability (available, busy, away,
    # in a call...) as Matrix presence on their ghosts. Needs presence enabled
    # on the homeserver; off by default because every change is a write there.
    sync_teams_presence: false

# Which changes to a chat's members, name, picture and pins carry over, per
# direction. Messages, reactions and edits always do, and a new room always
# gets the chat's name, picture and members.
matrix_to_teams:
    # Invites, kicks and renames apply to group and meeting chats only.
    # Inviting a Teams user's ghost adds them to the Teams chat.
    invite: true
    # Kicking a ghost removes them from the Teams chat.
    kick: true
    # Renaming the room renames the Teams chat.
    rename: true
    # Pinning or unpinning a message does the same in Teams.
    pins: true
teams_to_matrix:
    # People added to the Teams chat join the room. Off, they still join once
    # they send a message.
    invite: true
    # People removed from or leaving the Teams chat leave the room.
    kick: true
    # Renaming the Teams chat renames the room.
    rename: true
    # Teams pins show as the room's pinned messages.
    pins: true
    # A group chat's picture becomes the room's avatar.
    picture: true

# Override Teams API endpoints. Leave empty to use the commercial-cloud defaults.
endpoints:
    chat_svc: ""
    auth_svc: ""
    mt: ""
    trouter: ""
    ams: ""

# Teams calls. Only the call-test command places calls so far.
calls:
    # STUN server (host:port) the bridge uses to learn its public address for
    # call media. Leave empty to offer only the host's own addresses.
    stun_server: stun.l.google.com:19302
    # Pin the next occurrence of each meeting from your Teams calendar in its
    # meeting chat's room, and keep it current.
    upcoming_meetings: false
    # Post the transcript of a meeting Teams transcribed to its room once the
    # meeting ends, in a thread under the notice that the call ended.
    meeting_transcripts: true
    # Show Teams meetings that are running as Element Calls in their rooms.
    # Needs MatrixRTC (a LiveKit focus in the homeserver's .well-known).
    element_call: false
    # Also carry camera video and screen sharing between Teams meetings and
    # Element Call. Video Element Call sends as VP8 or VP9 is re-encoded to
    # H.264 with ffmpeg (with libx264), which costs CPU per stream.
    video: false
    # Send re-encoded Matrix cameras to Teams flipped left to right, the way
    # Element Call shows your own camera, instead of the way others see it.
    mirror_camera: false
